<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudySpark</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2033;--mute:#68708a;--brand:#5b4bdb;--ok:#18a058;--bad:#d03050;--line:#e3e6f0}
:root[data-theme=dark]{--bg:#12141f;--card:#1b1e2e;--ink:#eceefa;--mute:#9aa2bf;--line:#2c3047;--brand:#8f82ff}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141f;--card:#1b1e2e;--ink:#eceefa;--mute:#9aa2bf;--line:#2c3047;--brand:#8f82ff}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:1.3rem;margin:0;color:var(--brand)}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:#fff}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:wait}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:140px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.on{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.mute{color:var(--mute);font-size:.9rem}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;cursor:pointer;padding:24px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:85%;white-space:pre-wrap}.me{background:var(--brand);color:#fff;margin-left:auto}.ai{background:var(--bg);border:1px solid var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
.dia{overflow-x:auto;text-align:center}dt{font-weight:600}dd{margin:0 0 8px}
[hidden]{display:none!important}
header{background:linear-gradient(90deg,#5b4bdb,#0ea5e9);border:0}header h1{color:#fff}header .mute{color:#ffffffcc}header .alt{color:#fff;border-color:#fff8}
.hero{background:linear-gradient(135deg,#5b4bdb22,#ec489922,#f59e0b22);border-color:#5b4bdb55}
.set{border-top:5px solid var(--c)}.ico{font-size:2rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#0ea5e9);transition:width .4s}
.sec{border-left:6px solid var(--c)}.sec h3{margin-top:0;color:var(--c)}
.chip{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.lg{display:inline-flex;align-items:center;gap:5px;margin:0 12px 8px 0;font-size:.85rem}.lg i{width:12px;height:12px;border-radius:50%}
.fc{background:linear-gradient(135deg,var(--g1,#5b4bdb),var(--g2,#0ea5e9));color:#fff;border:0}.fc.back{background:linear-gradient(135deg,#10b981,#f59e0b)}
#fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;font-size:1.7rem;padding:0;background:linear-gradient(135deg,var(--g3,#ec4899),var(--g1,#5b4bdb));box-shadow:0 6px 20px #0005;z-index:20;display:flex;align-items:center;justify-content:center}
#chat{position:fixed;right:18px;bottom:90px;width:min(380px,calc(100vw - 36px));height:min(520px,70vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px #0006;z-index:20;display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(90deg,var(--g3,#ec4899),var(--g1,#5b4bdb));color:#fff;font-weight:600}.ch button{padding:2px 9px;color:#fff;border-color:#fff8}
#log{flex:1;overflow-y:auto;padding:10px}.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.cin textarea{min-height:44px;height:44px;resize:none}
#ask{position:fixed;z-index:21;border-radius:20px;background:linear-gradient(135deg,var(--g3,#ec4899),var(--g1,#5b4bdb));box-shadow:0 4px 14px #0005;padding:6px 12px;font-size:.85rem}
#pk{display:flex;gap:6px;align-items:center;padding:6px 10px;font-size:.8rem;background:color-mix(in srgb,#f59e0b 18%,transparent);border-top:1px solid var(--line)}#pk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#pk button{padding:0 8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}.flow .chip{flex:1 1 150px}.ar{align-self:center;font-size:1.3rem;color:var(--mute)}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;align-items:center;justify-content:center;font-size:.8rem;margin-right:6px}
.cmp{border-collapse:collapse;width:100%}.cmp th{color:#fff;padding:8px}.cmp td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:18px}.tl>div{position:relative;margin-bottom:12px}.tl>div::before{content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.gal figure{margin:0}.gal img{width:100%;height:170px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}.gal figcaption{font-size:.85rem;margin-top:4px}
.pas{padding:8px 10px;border-radius:10px;margin:4px 0;border-left:4px solid var(--line)}.pas.hl,.chip.hl{outline:3px solid #f59e0b;background:color-mix(in srgb,#f59e0b 22%,transparent)}
.loc{display:inline-block;font-size:.75rem;background:var(--line);border-radius:8px;padding:0 6px;margin-right:6px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes flowbg{to{background-position:300% 0}}@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.08)}}
@keyframes flip{from{transform:rotateY(90deg);opacity:.4}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 #ec489988}100%{box-shadow:0 0 0 18px #ec489900}}@keyframes up{from{opacity:0;transform:translate(-50%,20px)}}
@keyframes bounce{40%{transform:translateY(-8px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 20%,#5b4bdb26,transparent 40%),radial-gradient(circle at 80% 30%,#ec489922,transparent 40%),radial-gradient(circle at 50% 90%,#0ea5e922,transparent 40%);animation:drift 18s ease-in-out infinite alternate}
header{background:linear-gradient(90deg,var(--g1,#5b4bdb),var(--g2,#0ea5e9),var(--g3,#ec4899),var(--g1,#5b4bdb));background-size:300% 100%;animation:flowbg 14s linear infinite}
h1{display:inline-block;transition:transform .3s}h1:hover{transform:rotate(-4deg) scale(1.06)}
.card{animation:pop .4s ease both;transition:transform .2s,box-shadow .2s}.set:hover,.chip:hover{transform:translateY(-4px);box-shadow:0 8px 22px #0002}
.set:hover .ico{animation:bounce .6s}.card.sec{animation-delay:.05s}
button{transition:transform .12s,filter .15s}button:hover:not(:disabled){filter:brightness(1.12)}button:active:not(:disabled){transform:scale(.94)}
.fc{animation:flip .35s ease both;user-select:none}.opt.right{animation:pulse .5s}.opt.wrong{animation:shake .4s}
.msg{animation:pop .25s ease both}#chat{animation:pop .25s ease both}#fab{animation:ring 2.4s infinite}#fab:hover{transform:scale(1.1) rotate(8deg)}#toast{animation:up .25s ease}
#snd{padding:4px 10px;margin-right:8px}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}.conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@media(prefers-reduced-motion:reduce){:root[data-anim=auto] *,:root[data-anim=auto] *::before{animation:none!important;transition:none!important}}
:root[data-anim=off] *,:root[data-anim=off] *::before{animation:none!important;transition:none!important}
:root[data-anim=reduced] body::before,:root[data-anim=reduced] header,:root[data-anim=reduced] #fab,:root[data-anim=reduced] .card{animation:none!important}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}input[type=range]{width:140px}
.modal{position:fixed;inset:0;background:#0009;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--card);color:var(--ink);border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:20px;animation:pop .25s}.panel h3{margin:18px 0 4px;color:var(--brand)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{background:var(--brand);color:#fff}
.sw{width:44px;height:32px;border-radius:10px;border:3px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
.optw{margin:6px 0}.optw .opt{margin:0}.opt.sel{background:var(--brand);color:#fff}.opt.miss{outline:3px solid #f59e0b}
.why{font-size:.88rem;margin:3px 0 0 10px;color:var(--mute)}.why.g{color:var(--ok)}.why.b{color:var(--bad)}
</style>
</head>
<body>
<header><h1>⚡ StudySpark</h1><div style="display:flex;align-items:center"><button class="alt" id="gear" title="Settings">⚙️</button><button class="alt" id="snd" title="Sound on/off">🔊</button><div id="auth"></div></div></header>
<main id="app"></main>
<button id="fab" title="AI study tutor" hidden>🤖</button>
<div id="chat" hidden><div class="ch">🤖 AI study tutor <button class="alt" id="cx">✕</button></div><div id="log"></div><div id="pk" hidden></div><div class="cin"><textarea id="q" maxlength="1000" placeholder="Ask about your notes…"></textarea><button id="send">Send</button></div></div>
<button id="ask" hidden>🤖 Ask AI</button>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
/* ===== CONFIG: fill these in (see README) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBo6iQCHvpVsfky37Ddry0dwM87zIydSRY",
  authDomain: "studyspark-92528.firebaseapp.com",
  projectId: "studyspark-92528",
  storageBucket: "studyspark-92528.firebasestorage.app",
  messagingSenderId: "498758919495",
  appId: "1:498758919495:web:1df7d5f873793de7df9862"
};
const AI_URL = "https://studyspark-ai.vincenzobal12.workers.dev"; // Cloudflare Worker (holds the AI key)
/* ============================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,getDoc,getDocs,deleteDoc,query,orderBy} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const hue=s=>`hsl(${hash(s)%360} 70% 52%)`,icon=s=>["🧬","📐","🌍","⚗️","📜","💻","🎨","🔭","📊","🧠"][hash(s)%10];
const pct=s=>{const c=s.cards||[];return c.length?Math.round(100*c.filter(x=>x.box>=3).length/c.length):0};
const COL=["#5b4bdb","#0ea5e9","#10b981","#f59e0b","#ef4444","#ec4899","#8b5cf6"];
const GROUP={concept:["#5b4bdb","Concept"],process:["#0ea5e9","Process"],example:["#10b981","Example"],term:["#f59e0b","Term"]};
const PALETTES={aurora:{n:"Aurora",b:["#5b4bdb","#8f82ff"],g:["#5b4bdb","#0ea5e9","#ec4899"]},ocean:{n:"Ocean",b:["#0369a1","#38bdf8"],g:["#0369a1","#06b6d4","#6366f1"]},forest:{n:"Forest",b:["#15803d","#4ade80"],g:["#15803d","#84cc16","#0ea5e9"]},sunset:{n:"Sunset",b:["#c2410c","#fb923c"],g:["#ef4444","#f59e0b","#ec4899"]},berry:{n:"Berry",b:["#be185d","#f472b6"],g:["#be185d","#8b5cf6","#f59e0b"]},graphite:{n:"Graphite",b:["#374151","#9ca3af"],g:["#1f2937","#4b5563","#6b7280"]}};
const DEF={theme:"auto",palette:"aurora",sound:true,vol:.6,anim:"auto",types:{mc:true,multi:true,written:true},qn:0,shuffleQ:true,shuffleO:true,why:true};
let S={...DEF,types:{...DEF.types}};
try{const r=JSON.parse(localStorage.getItem("ss_settings")||"{}");S={...S,...r,types:{...S.types,...(r.types||{})}}}catch(e){}
const animOK=()=>S.anim==="full"||(S.anim==="auto"&&!matchMedia("(prefers-reduced-motion:reduce)").matches);
function applySettings(){
  const r=document.documentElement,dark=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches),P=PALETTES[S.palette]||PALETTES.aurora;
  if(S.theme==="auto")r.removeAttribute("data-theme");else r.dataset.theme=S.theme;
  r.dataset.anim=S.anim;r.style.setProperty("--brand",P.b[dark?1:0]);P.g.forEach((c,i)=>r.style.setProperty("--g"+(i+1),c));
  const b=$("#snd");if(b)b.textContent=S.sound?"🔊":"🔇";
}
let ptimer;
function persist(){
  try{localStorage.setItem("ss_settings",JSON.stringify(S))}catch(e){}
  applySettings();clearTimeout(ptimer);
  ptimer=setTimeout(()=>{if(user)setDoc(doc(db,"users",user.uid,"prefs","settings"),S).catch(()=>{})},800);
}
async function loadPrefs(u){
  try{const d=await getDoc(doc(db,"users",u.uid,"prefs","settings"));
    if(d.exists()){const r=d.data();S={...S,...r,types:{...S.types,...(r.types||{})}};try{localStorage.setItem("ss_settings",JSON.stringify(S))}catch(e){}applySettings()}}catch(e){}
}
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",applySettings);
function openSettings(){
  const old=$("#sm");if(old)old.remove();
  const m=document.createElement("div");m.id="sm";m.className="modal";document.body.appendChild(m);
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${S[key]===v?"on":"alt"}" data-k="${key}" data-v="${v}">${l}</button>`).join("")}</div>`;
  const chk=(label,on,key)=>`<label class="row"><span>${label}</span><input type="checkbox" data-c="${key}" ${on?"checked":""}></label>`;
  const draw=()=>{m.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">⚙️ Settings</h2><button class="alt" id="sx">✕</button></div>
  <h3>🎨 Appearance</h3><div class="row"><span>Theme</span>${seg("theme",[["auto","Auto"],["light","☀️ Light"],["dark","🌙 Dark"]])}</div>
  <div class="row"><span>Colours</span><div class="seg">${Object.entries(PALETTES).map(([id,p])=>`<button class="sw ${S.palette===id?"on":""}" title="${p.n}" data-pal="${id}" style="background:linear-gradient(135deg,${p.g[0]},${p.g[1]},${p.g[2]})"></button>`).join("")}</div></div>
  <h3>🔊 Sound</h3>${chk("Sound effects",S.sound,"sound")}<div class="row"><span>Volume</span><span><input type="range" id="vol" min="0.1" max="1" step="0.05" value="${S.vol}"> <button class="alt" id="tst">Test</button></span></div>
  <h3>✨ Animations</h3><div class="row"><span>Motion</span>${seg("anim",[["auto","Match device"],["full","Full"],["reduced","Reduced"],["off","Off"]])}</div>
  <h3>📝 Quizzes</h3>${chk("Multiple choice",S.types.mc,"t:mc")}${chk("Select all that apply",S.types.multi,"t:multi")}${chk("Written answers",S.types.written,"t:written")}
  <div class="row"><span>Questions per quiz</span><select id="qn">${[[0,"All"],[5,"5"],[10,"10"],[15,"15"],[20,"20"]].map(([v,l])=>`<option value="${v}" ${S.qn===v?"selected":""}>${l}</option>`).join("")}</select></div>
  ${chk("Shuffle question order",S.shuffleQ,"shuffleQ")}${chk("Shuffle answer options",S.shuffleO,"shuffleO")}${chk("Explain why wrong answers are wrong",S.why,"why")}
  <p><button class="alt" id="rst">Reset to defaults</button></p><p class="mute">Saved on this device${user?" and synced to your account":""}.</p></div>`};
  draw();
  m.onclick=e=>{
    if(e.target===m||e.target.id==="sx")return m.remove();
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.k){S[b.dataset.k]=b.dataset.v;persist();draw()}
    else if(b.dataset.pal){S.palette=b.dataset.pal;persist();draw()}
    else if(b.id==="tst")sfx.correct();
    else if(b.id==="rst"){S={...DEF,types:{...DEF.types}};persist();draw()}
  };
  m.onchange=e=>{const t=e.target;
    if(t.dataset.c){const k=t.dataset.c;if(k.startsWith("t:"))S.types[k.slice(2)]=t.checked;else S[k]=t.checked;persist()}
    if(t.id==="qn"){S.qn=+t.value;persist()}if(t.id==="vol"){S.vol=+t.value;persist()}};
}
let AC=null;
const tone=(f,d=.12,type="sine",v=.06,t0=0)=>{
  if(!S.sound)return;
  try{AC??=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v*S.vol/.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}
};
const sfx={click:()=>tone(520,.06,"triangle",.04),flip:()=>tone(400,.09,"triangle",.05),pop:()=>{tone(740,.07,"sine",.05);tone(988,.1,"sine",.05,.07)},
  correct:()=>{tone(660,.1,"sine",.07);tone(880,.16,"sine",.07,.09)},wrong:()=>{tone(200,.25,"sawtooth",.035);tone(160,.25,"sawtooth",.03,.12)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,"sine",.07,i*.11))};
function confetti(){
  if(!animOK())return;
  const w=document.createElement("div");w.className="conf";
  for(let i=0;i<70;i++){const e=document.createElement("i");e.style.cssText=`left:${Math.random()*100}%;background:${COL[i%COL.length]};animation-delay:${Math.random()*.6}s;animation-duration:${1.6+Math.random()*1.6}s`;w.appendChild(e)}
  document.body.appendChild(w);setTimeout(()=>w.remove(),4200);
}
document.addEventListener("click",e=>{if(e.target.closest("button")&&!e.target.closest(".opt,[data-nosfx]"))sfx.click()});
applySettings();
$("#snd").onclick=()=>{S.sound=!S.sound;persist()};
$("#gear").onclick=openSettings;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=$("#sm");m&&m.remove()}});
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",4000)};
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fbApp=initializeApp(firebaseConfig), auth=getAuth(fbApp), db=getFirestore(fbApp);
let user=null, sets=[], cur=null, tab="notes", nav=null;
const setsCol=()=>collection(db,"users",user.uid,"sets");

$("#auth").onclick=async e=>{
  if(e.target.id==="in"){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(err){toast("Sign-in failed: "+err.code)}}
  if(e.target.id==="out")signOut(auth);
};
onAuthStateChanged(auth,async u=>{
  user=u;cur=null;$("#fab").hidden=!u;if(!u)$("#chat").hidden=true;

async function readPptx(buf){
  const z=await JSZip.loadAsync(buf);
  const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);
  if(!names.length)throw new Error("This doesn't look like a PowerPoint (.pptx) file.");
  let t="";
  for(const [i,n] of names.slice(0,100).entries()){
    const xml=await z.files[n].async("string");
    const x=[...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
    t+=`Slide ${i+1}: ${x}\n`;
  }
  if(t.replace(/Slide \d+:/g,"").trim().length<50)throw new Error("No readable text found in these slides (text inside images isn't read).");
  return t;
}
async function extract(f){
  if(!/\.(txt|md|pdf|pptx)$/i.test(f.name))throw new Error("only .txt, .md, .pdf and .pptx files are allowed.");
  if(f.size>5*1024*1024)throw new Error("file is over 5 MB.");
  if(/\.pdf$/i.test(f.name)){
    const buf=await f.arrayBuffer();
    if(new TextDecoder().decode(buf.slice(0,5))!=="%PDF-")throw new Error("not a valid PDF.");
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;let t="";
    for(let i=1;i<=Math.min(pdf.numPages,60);i++)t+="Page "+i+": "+(await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ")+"\n";
    if(t.replace(/Page \d+:/g,"").trim().length<50)throw new Error("no readable text (scanned PDFs need OCR, which isn’t supported).");
    return t;
  }
  if(/\.pptx$/i.test(f.name)){
    const buf=await f.arrayBuffer();
    if(new TextDecoder().decode(buf.slice(0,2))!=="PK")throw new Error("not a valid .pptx file.");
    return readPptx(buf);
  }
  return f.text();
}
async function readFiles(files,st){
  let out="";const list=[...files];
  if(list.length>10)toast("Only the first 10 files will be used.");
  for(const f of list.slice(0,10)){
    st.textContent="Reading "+f.name+"…";
    try{out+=`=== ${f.name} ===\n${await extract(f)}\n\n`}catch(e){toast(f.name+": "+e.message)}
  }
  return out.slice(0,200000);
}
function sample(text,limit=14000){
  const parts=String(text).split(/^(?==== .+ ===$)/m).filter(x=>x.trim());
  if(parts.length<2)return String(text).slice(0,limit);
  const each=Math.floor(limit/parts.length);return parts.map(x=>x.slice(0,each)).join("\n");
}

function conceptMap(el,d){
  const W=700,H=460,N=d.nodes.slice(0,14),by=Object.fromEntries(N.map(n=>[n.id,n])),deg={};
  N.forEach(n=>deg[n.id]=0);
  const L=(d.links||[]).filter(l=>by[l.from]&&by[l.to]&&l.from!==l.to).slice(0,30);
  L.forEach(l=>{deg[l.from]++;deg[l.to]++});
  const hub=N.reduce((a,b)=>deg[b.id]>deg[a.id]?b:a,N[0]),rest=N.filter(n=>n!==hub);
  hub.x=W/2;hub.y=H/2;
  rest.forEach((n,i)=>{const a=2*Math.PI*i/rest.length-Math.PI/2;n.x=W/2+Math.cos(a)*W*.36;n.y=H/2+Math.sin(a)*H*.38});
  const col=n=>(GROUP[n.group]||GROUP.concept)[0];let sel=null,drag=null,moved=0,sx=0,sy=0;
  const near=id=>sel&&(id===sel||L.some(l=>(l.from===sel&&l.to===id)||(l.to===sel&&l.from===id)));
  const draw=()=>{el.innerHTML=`<div>${Object.values(GROUP).map(g=>`<span class="lg"><i style="background:${g[0]}"></i>${g[1]}</span>`).join("")}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;touch-action:none;user-select:none">${L.map(l=>{const a=by[l.from],b=by[l.to],on=sel&&(l.from===sel||l.to===sel);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${on?col(by[sel]):"#9aa2bf"}" stroke-width="${on?3.5:1.5}" opacity="${sel&&!on?.15:.7}"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}" font-size="11" text-anchor="middle" fill="currentColor" opacity="${sel&&!on?0:.85}">${esc(l.label)}</text>`}).join("")}
  ${N.map(n=>`<g data-id="${esc(n.id)}" style="cursor:grab" opacity="${sel&&!near(n.id)?.25:1}"><rect x="${n.x-58}" y="${n.y-18}" width="116" height="36" rx="18" fill="${col(n)}" stroke="${sel===n.id?"currentColor":"none"}" stroke-width="3"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">${esc(n.label.slice(0,19))}</text></g>`).join("")}</svg>
  <div class="mute">${sel?`<b>${esc(by[sel].label)}</b>: ${esc(by[sel].detail)}`:"Tap a bubble to see its details and connections. Drag bubbles to rearrange."}</div>`};
  el.onpointerdown=e=>{const g=e.target.closest("g[data-id]");if(!g)return;drag=by[g.dataset.id];moved=0;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(!drag)return;moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy));if(moved<6)return;
    const r=el.querySelector("svg").getBoundingClientRect();drag.x=Math.max(60,Math.min(W-60,(e.clientX-r.left)*W/r.width));drag.y=Math.max(20,Math.min(H-20,(e.clientY-r.top)*H/r.height));draw()};
  el.onpointerup=()=>{if(drag&&moved<6){sel=sel===drag.id?null:drag.id;draw()}drag=null};
  draw();
}

const toks=t=>new Set((String(t).toLowerCase().match(/[a-z0-9\u00c0-\u024f]{4,}/g)||[]).filter(w=>!STOP.has(w)));
function passages(text){
  const out=[],cnt={};let src="Pasted notes";
  const chunk=(t,loc)=>{let c="";for(const x of (t.match(/[^.!?]+[.!?]*\s*/g)||[t])){if(c&&(c+x).length>500){out.push({src,loc,text:c.trim()});c=x}else c+=x}if(c.trim())out.push({src,loc,text:c.trim()})};
  for(const line of String(text).split("\n")){
    const h=line.match(/^=== (.+) ===$/);if(h){src=h[1];continue}
    const t=line.trim();if(!t)continue;
    const m=t.match(/^(Slide|Page) (\d+): ?(.*)$/);
    if(m){if(m[3])chunk(m[3],m[1]+" "+m[2])}else{cnt[src]=(cnt[src]||0)+1;chunk(t,"Section "+cnt[src])}
  }
  return out;
}

      $("#wa").disabled=true;b.remove();
      const model=`<p><b>Model answer:</b> ${esc(q.sample)}</p>${(q.keypoints||[]).length?`<p>Key points: ${q.keypoints.map(esc).join(" · ")}</p>`:""}`;
      if(g){g.score>=1?sfx.correct():sfx.wrong();$("#ex").innerHTML=`<p><b>${g.score>=1?"✅ Great answer":g.score>0?"🟡 Partly right":"❌ Not quite"}:</b> ${esc(g.feedback)}</p>`+model;finish(q,g.score)}
      else{$("#ex").innerHTML=model+'<p><b>The AI couldn’t grade this, so mark yourself:</b></p><button class="alt" data-sg="1">✅ Got it</button> <button class="alt" data-sg=".5">🟡 Partly</button> <button class="alt" data-sg="0">❌ Not yet</button>';
        p.querySelectorAll("[data-sg]").forEach(x=>x.onclick=()=>{const v=+x.dataset.sg;v>=1?sfx.correct():sfx.wrong();finish(q,v)})}
    };
  };draw();
}
function source(p){
  const P=passages(cur.text||"");let last=null;
  p.innerHTML=`<p class="mute">Your original notes, grouped by file. Quiz review links jump to the matching passage here.</p>`+(P.map((x,i)=>`${(x.src!==last&&(last=x.src))?`<h3>📄 ${esc(x.src)}</h3>`:""}<div class="pas" id="p-${i}"><span class="loc">${esc(x.loc)}</span>${esc(x.text)}</div>`).join("")||'<p class="mute">No saved notes text.</p>');
}
function mergeDiagram(a,b){
  const ok=d=>d&&Array.isArray(d.nodes)&&d.nodes.length>1;
  if(!ok(b))return a||null;if(!ok(a))return b;
  const nb=b.nodes.slice(0,5),keep=new Set(nb.map(x=>x.id)),px=x=>"m_"+x;
  return{nodes:[...a.nodes,...nb.map(x=>({...x,id:px(x.id)}))],links:[...(a.links||[]),...(b.links||[]).filter(l=>keep.has(l.from)&&keep.has(l.to)).map(l=>({...l,from:px(l.from),to:px(l.to)})),{from:a.nodes[0].id,to:px(nb[0].id),label:"also covers"}]};
}
function mergeInto(c,g,text){
  const n=c.notes||{},m=g.notes||{},cat=k=>[...(n[k]||[]),...(m[k]||[])];
  c.notes={...n,summary:[n.summary,m.summary].filter(Boolean).join("\n\n"),concepts:cat("concepts"),vocab:cat("vocab"),examples:cat("examples"),diagram:mergeDiagram(n.diagram,m.diagram)};
  const seen=new Set((c.quiz||[]).map(q=>String(q.q).toLowerCase()));
  c.quiz=[...(c.quiz||[]),...(g.quiz||[]).filter(q=>!seen.has(String(q.q).toLowerCase()))];
  const have=new Set((c.cards||[]).map(x=>String(x.front).toLowerCase()));
  c.cards=[...(c.cards||[]),...(g.cards||[]).filter(x=>!have.has(String(x.front).toLowerCase())).map(x=>({front:String(x.front),back:String(x.back),box:0}))];
  const v=c.visuals||{},w=g.visuals||{};
  c.visuals={steps:v.steps||w.steps||null,compare:v.compare||w.compare||null,timeline:v.timeline||w.timeline||null,images:[...(v.images||[]),...(w.images||[])],resolved:false};
  const d=c.dialogues,e=g.dialogues&&Array.isArray(g.dialogues.items)&&g.dialogues.items.length?g.dialogues:null;
  c.dialogues=d&&e&&d.lang===e.lang?{...d,items:[...d.items,...e.items].slice(0,6)}:(d||e||null);
  c.text=((c.text||"")+"\n\n"+(text.startsWith("===")?"":"=== Added "+new Date().toLocaleDateString()+" ===\n")+text).slice(0,60000);
}
function addTab(p){
  p.innerHTML=`<div class="card hero"><h3>➕ Add more notes to this set</h3><p class="mute">Upload more files or paste more text. New flashcards, quiz questions, concepts and vocabulary are added to this set. Nothing is removed.</p>
  <p><input type="file" id="afile" multiple accept=".txt,.md,.pdf,.pptx"> <span class="mute">up to 10 files, 5 MB each</span></p>
  <textarea id="atxt" placeholder="…or paste more notes here"></textarea><p><button id="ago">Add to set</button> <span id="ast" class="mute"></span></p></div>`;
  $("#afile").onchange=async()=>{const fs=$("#afile").files;if(!fs.length)return;const t=await readFiles(fs,$("#ast"));
    $("#atxt").value=($("#atxt").value.trim()?$("#atxt").value+"\n\n":"")+t;$("#ast").textContent=`Loaded ${$("#atxt").value.length.toLocaleString()} characters.`;$("#afile").value=""};
  $("#ago").onclick=async()=>{
    const text=$("#atxt").value.trim();if(text.length<200)return toast("Add at least a few paragraphs (200+ characters).");
    const b=$("#ago");b.disabled=true;b.innerHTML='<span class="spin"></span>Adding… (10–30s)';
    try{
      const c0=(cur.cards||[]).length,q0=(cur.quiz||[]).length;
      mergeInto(cur,await ai("/generate",{text:sample(text)}),text);
      await setDoc(doc(setsCol(),cur.id),{text:cur.text,notes:cur.notes,cards:cur.cards,quiz:cur.quiz,visuals:cur.visuals,dialogues:cur.dialogues},{merge:true});
      toast(`Added ${cur.cards.length-c0} flashcards and ${cur.quiz.length-q0} questions.`);tab="notes";study();
    }catch(e){toast(e.message);b.disabled=false;b.textContent="Add to set"}
  };
}

/* ---------- Visuals & conversations ---------- */
async function findImage(q){
  try{
    const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=500");
    if(!r.ok)return null;
    const pages=Object.values((await r.json()).query?.pages||{}).sort((a,b)=>a.index-b.index);
    for(const pg of pages){
      const i=pg.imageinfo?.[0];
      if(!i||!/^image\/(jpeg|png|svg\+xml)$/.test(i.mime)||!String(i.thumburl).startsWith("https://upload.wikimedia.org/"))continue;
      const m=i.extmetadata||{},strip=h=>String(h||"").replace(/<[^>]*>/g,"").trim().slice(0,70);
      return{src:i.thumburl,page:String(i.descriptionurl).startsWith("https://commons.wikimedia.org/")?i.descriptionurl:"https://commons.wikimedia.org/",credit:strip(m.Artist?.value)||"Unknown author",lic:strip(m.LicenseShortName?.value)};
    }
  }catch(e){}
  return null;
}
async function visuals(p){
  const v=cur.visuals||{},n=cur.notes||{},st=v.steps,c=v.compare;
  const sec=(col,h,b)=>`<div class="card sec" style="--c:${col}"><h3>${h}</h3>${b}</div>`;
  let html="";
  if(st?.items?.length)html+=sec("#0ea5e9","🔄 "+esc(st.title||"Process"),`<div class="flow">${st.items.map((x,i)=>`${i?'<span class="ar">➜</span>':""}<div class="chip" style="--c:${COL[i%COL.length]}"><span class="num">${i+1}</span><b>${esc(x.label)}</b><br>${esc(x.detail)}</div>`).join("")}${st.cycle?'<span class="ar">↻ repeats</span>':""}</div>`);
  if(c?.rows?.length)html+=sec("#8b5cf6","⚖️ "+esc(c.title||"Comparison"),`<div style="overflow-x:auto"><table class="cmp"><tr><th></th><th style="background:${COL[0]}">${esc(c.left)}</th><th style="background:${COL[2]}">${esc(c.right)}</th></tr>${c.rows.map(r=>`<tr><td><b>${esc(r.aspect)}</b></td><td>${esc(r.left)}</td><td>${esc(r.right)}</td></tr>`).join("")}</table></div>`);
  if(Array.isArray(v.timeline)&&v.timeline.length)html+=sec("#f59e0b","⏳ Timeline",`<div class="tl">${v.timeline.map((x,i)=>`<div style="--c:${COL[i%COL.length]}"><b>${esc(x.when)}</b><br>${esc(x.what)}</div>`).join("")}</div>`);
  p.innerHTML=html+sec("#ec4899","🖼️ Images",'<div id="imgs" class="mute">Looking for images…</div>');
  let imgs=v.images||[];
  if(!v.resolved){
    const have=imgs.filter(x=>x.src),qs=imgs.length?imgs.filter(x=>!x.src):(n.concepts||[]).slice(0,4).map(x=>({query:x.term,caption:x.term}));
    const got=(await Promise.all(qs.slice(0,5).map(async q=>{const f=await findImage(String(q.query));return f&&{...f,caption:String(q.caption||q.query)}}))).filter(Boolean);
    imgs=[...have,...got].slice(0,10);
    cur.visuals={...v,images:imgs,resolved:true};save({visuals:cur.visuals});
  }
  const box=$("#imgs");if(!box)return;
  box.className="";
  box.innerHTML=imgs.length?`<div class="gal">${imgs.map((x,i)=>`<figure><img loading="lazy" src="${esc(x.src)}" alt="${esc(x.caption)}"><figcaption><b>${esc(x.caption)}</b><br><span class="mute">${esc(x.credit)} · ${esc(x.lic)} · <a href="${esc(x.page)}" target="_blank" rel="noopener">source</a> · <a href="#" data-x="${i}">not relevant?</a></span></figcaption></figure>`).join("")}</div>`:'<p class="mute">No matching images were found for this set.</p>';
  box.querySelectorAll("[data-x]").forEach(a=>a.onclick=e=>{e.preventDefault();imgs.splice(+a.dataset.x,1);cur.visuals.images=imgs;save({visuals:cur.visuals});visuals(p)});
}
function talk(p){
  const d=cur.dialogues,lang=d.lang||"en-US",shown={};let tr=true,hide=false;
  const stop=()=>window.speechSynthesis&&speechSynthesis.cancel();
  const speak=(t,done)=>{if(!window.speechSynthesis)return toast("Speech isn’t supported in this browser.");const u=new SpeechSynthesisUtterance(t);u.lang=lang;if(done)u.onend=done;speechSynthesis.speak(u)};
  const playAll=i=>{stop();const L=d.items[i].lines||[],next=j=>j<L.length&&speak(L[j].text,()=>next(j+1));next(0)};
  const draw=()=>{
    p.innerHTML=`<p class="mute">Tap a line to hear it (voices depend on your device). Language: ${esc(lang)}</p>
    <p><button class="alt" id="t1">${tr?"Hide":"Show"} translations</button> <button class="${hide?"on":"alt"}" id="t2">Practice mode</button></p>`
    +d.items.map((it,i)=>{const side={};return `<div class="card sec" style="--c:${COL[i%COL.length]}"><h3>💬 ${esc(it.title)}</h3><p><button class="alt" data-all="${i}">▶ Play all</button></p>`
      +(it.lines||[]).map((l,j)=>{const sp=String(l.speaker);side[sp]??=Object.keys(side).length%2;const k=i+"-"+j,hid=hide&&!shown[k];
        return `<div class="msg ${side[sp]?"me":"ai"}" data-k="${k}" data-i="${i}" data-j="${j}" style="cursor:pointer"><b>${esc(sp)}</b><br>${hid?`<i>${esc(l.translation)}</i><br><small>👆 tap to reveal</small>`:`${esc(l.text)}${tr?`<br><small style="opacity:.8">${esc(l.translation)}</small>`:""}`}</div>`}).join("")+"</div>"}).join("");
    $("#t1").onclick=()=>{tr=!tr;draw()};$("#t2").onclick=()=>{hide=!hide;draw()};
    p.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>playAll(+b.dataset.all));
    p.querySelectorAll("[data-k]").forEach(m=>m.onclick=()=>{shown[m.dataset.k]=true;stop();speak(d.items[m.dataset.i].lines[m.dataset.j].text);draw()});
  };draw();
}

const chats={};let picked="";
function chip(){
  const e=$("#pk");e.hidden=!picked;
  e.innerHTML=picked?`<span>📌 “${esc(picked.slice(0,80))}${picked.length>80?"…":""}”</span><button class="alt" id="pkx">✕</button>`:"";
  if(picked)$("#pkx").onclick=()=>{picked="";chip()};
}
document.addEventListener("selectionchange",()=>{
  const s=getSelection(),t=s?s.toString().trim():"",a=$("#ask");
  if(!t||!s.rangeCount){a.hidden=true;return}
  const n=s.anchorNode&&(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);
  if(!user||!n||n.closest("#chat,#ask,textarea,input"))return;
  picked=t.slice(0,1500);chip();
  const r=s.getRangeAt(0).getBoundingClientRect();
  a.style.left=Math.max(8,Math.min(innerWidth-110,r.left))+"px";
  a.style.top=(r.bottom+48<innerHeight?r.bottom+8:Math.max(8,r.top-44))+"px";a.hidden=false;
});
$("#ask").onmousedown=e=>e.preventDefault();
$("#ask").onclick=()=>{$("#chat").hidden=false;chatDraw();$("#ask").hidden=true;if(!$("#q").value)$("#q").value="Explain this";$("#q").focus()};
const hist=()=>chats[cur?cur.id:"general"]??=[];
function chatDraw(){
  const h=hist(),log=$("#log");
  log.innerHTML=(h.length?"":`<div class="msg ai">Hi! I can explain ideas, give hints and ask guiding questions${cur?" about “"+esc(cur.title)+"”":""}. For homework or quizzes I won’t hand over answers.</div>`)+h.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("");
  log.scrollTop=log.scrollHeight;
}
$("#fab").onclick=()=>{$("#chat").hidden=!$("#chat").hidden;chatDraw()};
$("#cx").onclick=()=>$("#chat").hidden=true;
$("#q").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#send").click()}};
$("#send").onclick=async()=>{
  const q=$("#q").value.trim();if(!q)return;const h=hist();h.push({role:"user",content:q});$("#q").value="";chatDraw();
  const b=$("#send");b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{const r=await ai("/chat",{messages:h.slice(-10),context:sample(cur?.text||"",6000),selection:picked});h.push({role:"assistant",content:r.reply});picked="";chip();sfx.pop()}
  catch(e){h.pop();toast(e.message)}
  b.disabled=false;b.textContent="Send";chatDraw();
};
</script>
