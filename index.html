async function readPptx(buf){
  const z=await JSZip.loadAsync(buf);
  const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);
  if(!names.length)throw new Error("This doesn't look like a PowerPoint (.pptx) file.");
  let t="";
  for(const [i,n] of names.slice(0,100).entries()){
    const xml=await z.files[n].async("string");
    const x=[...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
    t+=`Slide ${i+1}: ${x}\n`;
  }
  if(t.replace(/Slide \d+:/g,"").trim().length<50)throw new Error("No readable text found in these slides (text inside images isn't read).");
  return t;
}
async function extract(f){
  const isImg=IMG_RE.test(f.name);
  if(!isImg&&!/\.(txt|md|pdf|pptx)$/i.test(f.name))throw new Error("only .txt, .md, .pdf, .pptx files and photos (.jpg, .png, .webp) are allowed.");
  if(f.size>10*1024*1024)throw new Error("file is over 10 MB.");
  if(isImg){
    if(ocrMode==="ai"&&user){
      try{const t=await aiReadPhoto(f);if(t.includes("[?]"))toast(`${f.name}: some words were unclear and are marked [?]. Please check them before generating.`);return t}
      catch(e){toast(`${f.name}: ${e.message} Using the in-browser reader instead.`)}
    }
    const cv=await prepImage(f),w=await getOcr();ocrName=f.name;
    const{data}=await w.recognize(cv),t=tidyOcr(data.text);
    if(t.replace(/\s/g,"").length<30)throw new Error("couldn’t read enough text. Try a sharper, well-lit, straight-on photo.");
    if(data.confidence<65)toast(`${f.name}: the text may contain mistakes (reading confidence ${Math.round(data.confidence)}%). Please check it before generating.`);
    return t;
  }
  if(/\.pdf$/i.test(f.name)){
    const buf=await f.arrayBuffer();
    if(new TextDecoder().decode(buf.slice(0,5))!=="%PDF-")throw new Error("not a valid PDF.");
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;let t="";
    for(let i=1;i<=Math.min(pdf.numPages,60);i++)t+="Page "+i+": "+(await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ")+"\n";
    if(t.replace(/Page \d+:/g,"").trim().length<50)throw new Error("no readable text (scanned PDFs need OCR, which isn’t supported).");
    return t;
  }
  if(/\.pptx$/i.test(f.name)){
    const buf=await f.arrayBuffer();
    if(new TextDecoder().decode(buf.slice(0,2))!=="PK")throw new Error("not a valid .pptx file.");
    return readPptx(buf);
  }
  return f.text();
}

function sample(text,limit=14000){
  const parts=String(text).split(/^(?==== .+ ===$)/m).filter(x=>x.trim());
  if(parts.length<2)return String(text).slice(0,limit);
  const each=Math.floor(limit/parts.length);return parts.map(x=>x.slice(0,each)).join("\n");
}

async function ai(path,body){
  const r=await fetch(AI_URL+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await user.getIdToken()},body:JSON.stringify(body)}).catch(()=>null);
  if(!r)throw new Error("Can’t reach the AI service. Check your internet connection.");
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===429&&Q[path]){Q[path].left=0;renderQuota()}throw new Error(j.error||"AI service error ("+r.status+")")}
  if(typeof j.left==="number"){Q[path]={...(Q[path]||{}),left:j.left};renderQuota()}
  return j;
}

function mapData(n){
  const d=n.diagram;
  if(d&&Array.isArray(d.nodes)){
    const ids=new Set();
    const nodes=d.nodes.filter(x=>x&&x.id&&x.label&&!ids.has(String(x.id))&&ids.add(String(x.id))).map(x=>({id:String(x.id),label:String(x.label),group:x.group,detail:String(x.detail||"")}));
    if(nodes.length>1)return{nodes,links:(d.links||[]).map(l=>({from:String(l.from),to:String(l.to),label:String(l.label||"")}))};
  }
  const nodes=[{id:"h",label:cur.title,group:"concept",detail:n.summary||""}],links=[];
  const add=(a,g,lb,dt)=>(a||[]).forEach((x,i)=>{const id=g+i;nodes.push({id,label:lb(x,i),group:g,detail:dt(x)});links.push({from:"h",to:id,label:""})});
  add((n.concepts||[]).slice(0,5),"concept",x=>x.term,x=>x.explanation);

}
function conceptMap(el,d){
  const W=700,H=460,N=d.nodes.slice(0,14),by=Object.fromEntries(N.map(n=>[n.id,n])),deg={};
  N.forEach(n=>deg[n.id]=0);
  const L=(d.links||[]).filter(l=>by[l.from]&&by[l.to]&&l.from!==l.to).slice(0,30);
  L.forEach(l=>{deg[l.from]++;deg[l.to]++});
  const hub=N.reduce((a,b)=>deg[b.id]>deg[a.id]?b:a,N[0]),rest=N.filter(n=>n!==hub);
  hub.x=W/2;hub.y=H/2;
  rest.forEach((n,i)=>{const a=2*Math.PI*i/rest.length-Math.PI/2;n.x=W/2+Math.cos(a)*W*.36;n.y=H/2+Math.sin(a)*H*.38});
  const col=n=>(GROUP[n.group]||GROUP.concept)[0];let sel=null,drag=null,moved=0,sx=0,sy=0;
  const near=id=>sel&&(id===sel||L.some(l=>(l.from===sel&&l.to===id)||(l.to===sel&&l.from===id)));
  const draw=()=>{el.innerHTML=`<div>${Object.values(GROUP).map(g=>`<span class="lg"><i style="background:${g[0]}"></i>${g[1]}</span>`).join("")}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;touch-action:none;user-select:none">${L.map(l=>{const a=by[l.from],b=by[l.to],on=sel&&(l.from===sel||l.to===sel);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${on?col(by[sel]):"#9aa2bf"}" stroke-width="${on?3.5:1.5}" opacity="${sel&&!on?.15:.7}"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}" font-size="11" text-anchor="middle" fill="currentColor" opacity="${sel&&!on?0:.85}">${esc(l.label)}</text>`}).join("")}
  ${N.map(n=>`<g data-id="${esc(n.id)}" style="cursor:grab" opacity="${sel&&!near(n.id)?.25:1}"><rect x="${n.x-58}" y="${n.y-18}" width="116" height="36" rx="18" fill="${col(n)}" stroke="${sel===n.id?"currentColor":"none"}" stroke-width="3"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">${esc(n.label.slice(0,19))}</text></g>`).join("")}</svg>
  <div class="mute">${sel?`<b>${esc(by[sel].label)}</b>: ${esc(by[sel].detail)}`:"Tap a bubble to see its details and connections. Drag bubbles to rearrange."}</div>`};
  el.onpointerdown=e=>{const g=e.target.closest("g[data-id]");if(!g)return;drag=by[g.dataset.id];moved=0;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(!drag)return;moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy));if(moved<6)return;
    const r=el.querySelector("svg").getBoundingClientRect();drag.x=Math.max(60,Math.min(W-60,(e.clientX-r.left)*W/r.width));drag.y=Math.max(20,Math.min(H-20,(e.clientY-r.top)*H/r.height));draw()};
  el.onpointerup=()=>{if(drag&&moved<6){sel=sel===drag.id?null:drag.id;draw()}drag=null};
  draw();
}

const STOP=new Set("which what that this with from have been their there about would these those where when into than then also only does most each other such because while after before between".split(" "));
const toks=t=>new Set((String(t).toLowerCase().match(/[a-z0-9\u00c0-\u024f]{4,}/g)||[]).filter(w=>!STOP.has(w)));
function passages(text){
  const out=[],cnt={};let src="Pasted notes";
  const chunk=(t,loc)=>{let c="";for(const x of (t.match(/[^.!?]+[.!?]*\s*/g)||[t])){if(c&&(c+x).length>500){out.push({src,loc,text:c.trim()});c=x}else c+=x}if(c.trim())out.push({src,loc,text:c.trim()})};
  for(const line of String(text).split("\n")){
    const h=line.match(/^=== (.+) ===$/);if(h){src=h[1];continue}
    const t=line.trim();if(!t)continue;
    const m=t.match(/^(Slide|Page) (\d+): ?(.*)$/);
    if(m){if(m[3])chunk(m[3],m[1]+" "+m[2])}else{cnt[src]=(cnt[src]||0)+1;chunk(t,"Section "+cnt[src])}
  }
  return out;
}
function locate(q){
  const want=toks(q.q+" "+ans(q)+" "+(q.explain||"")),P=passages(cur.text||"");
  let best=null,bs=0;
  P.forEach((p,i)=>{const t=toks(p.text);let sc=0;want.forEach(w=>t.has(w)&&sc++);if(sc>bs){bs=sc;best={...p,i}}});
  return bs>=2?best:null;
}
function concept(q){
  const want=toks(q.q+" "+ans(q)+" "+(q.explain||""));let best=-1,bs=1;
  (cur.notes?.concepts||[]).forEach((c,i)=>{const t=toks(c.term+" "+c.explanation);let sc=0;want.forEach(w=>t.has(w)&&sc++);if(sc>bs){bs=sc;best=i}});
  return best;
}

async function findImage(q){
  try{
    const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=500");
    if(!r.ok)return null;
    const pages=Object.values((await r.json()).query?.pages||{}).sort((a,b)=>a.index-b.index);
    for(const pg of pages){
      const i=pg.imageinfo?.[0];
      if(!i||!/^image\/(jpeg|png|svg\+xml)$/.test(i.mime)||!String(i.thumburl).startsWith("https://upload.wikimedia.org/"))continue;
      const m=i.extmetadata||{},strip=h=>String(h||"").replace(/<[^>]*>/g,"").trim().slice(0,70);
      return{src:i.thumburl,page:String(i.descriptionurl).startsWith("https://commons.wikimedia.org/")?i.descriptionurl:"https://commons.wikimedia.org/",credit:strip(m.Artist?.value)||"Unknown author",lic:strip(m.LicenseShortName?.value)};
    }
  }catch(e){}
  return null;
}

const dstr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function streakInfo(){
  const days=new Set(ST.days);let cur=0,d=new Date();
  if(!days.has(dstr(d)))d.setDate(d.getDate()-1);
  while(days.has(dstr(d))){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  for(const x of [...days].sort()){const t=new Date(x+"T12:00:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;best=Math.max(best,run)}
  return{cur,best:Math.max(best,ST.best||0),today:days.has(dstr())};
}

  <h3>What we keep</h3><p>When you sign in with Google, we receive your name, email and profile picture from Google. We show your name inside the app. We store your study sets (your notes text, the study materials made from them, flashcard and quiz progress), your settings, and your streak and badges, so they’re there when you come back.</p>
  <h3>Who processes it</h3><ul><li><b>Google Firebase</b> stores your account and data.</li><li><b>An AI service (Groq)</b>, reached through our own server, receives the text of your notes when you make a set, your tutor questions, and your written quiz answers, so it can reply. Please don’t include private details such as addresses, phone numbers or health or school records.</li><li><b>Photos</b> of notes are read inside your browser by default and aren’t uploaded. If you choose “Better for handwriting (AI)”, each photo is sent to the AI service (Groq) to be turned into text. StudySpark doesn’t keep the photo, only the text.</li><li><b>Wikimedia Commons</b> receives search words (not your name) to find images. Fonts and code libraries load from public CDNs.</li><li><b>Dictation</b> uses your browser’s speech service. In Chrome and Edge your voice goes to Google or Microsoft while you dictate.</li></ul>
  <h3>Feedback</h3><p>If you send feedback, we receive your message. With your permission we also receive technical details (browser and screen size) and your Google email so we can reply. Please don’t put private information in feedback.</p>
  <h3>Sharing</h3><p>If you create a share link, anyone who has the link can view a copy of that set’s study materials until it expires or you stop sharing. Original notes, scores and your email are not included.</p>
  <h3>Your choices</h3><p>In <b>⚙️ Settings → Your data</b> you can download your data, or delete all of it, including share links. You can also stop sharing a set at any time.</p>
  <h3>Using StudySpark</h3><ul><li>StudySpark is a study aid. AI-made content can be wrong, so check it against your own notes and your teacher.</li><li>Only upload notes you’re allowed to use. Don’t upload anything unlawful, harmful or private about other people.</li><li>Don’t use the tutor to get answers to graded work; it is designed to give hints.</li><li>The service is provided as is, may change or stop, and may have limits to keep it free.</li></ul>
  ${CONTACT?`<h3>Contact</h3><p>${esc(CONTACT)}</p>`:""}</div>`;
  m.onclick=e=>{if(e.target===m||e.target.id==="sx")m.remove()};document.body.appendChild(m);$("#sx").focus();

/* ---------- Explain it differently ---------- */
const XC={},XQ={},XSTYLES=[["simpler","🧒 Simpler"],["analogy","🔗 Analogy"],["example","📌 Example"],["steps","🪜 Steps"],["memory","🧠 Memory trick"]];
const XTAG={simpler:"in simple words",analogy:"as an analogy",example:"example",steps:"step by step",memory:"memory trick"};
function openExplain(item){
  if(!user)return toast("Sign in to use this.");
  stopListen();const old=$("#sm");if(old)old.remove();
  const canAdd=!!(cur&&cur.id&&!cur.shared);let last=null,added=false,addedQ=false,genQ=null;
  const m=document.createElement("div");m.id="sm";m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","Explain it differently");
  m.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">💡 Explain it differently</h2><button class="alt" id="sx" aria-label="Close">✕</button></div>
  <div class="chip" style="--c:#b45309;margin:8px 0"><b>${esc(item.a)}</b>${item.b?`<br>${esc(item.b)}`:""}</div>
  <p class="mute">Pick a style:</p><div class="seg" role="group" aria-label="Explanation style">${XSTYLES.map(([k,l])=>`<button class="alt" data-x="${k}">${l}</button>`).join("")}</div>
  <div id="xo" aria-live="polite" style="margin-top:12px;white-space:pre-wrap"></div>
  ${canAdd?'<hr><p><button class="alt" id="xq">📝 Make practice questions about this</button></p><div id="xqo" aria-live="polite"></div><p class="mute"><span class="qleft" data-p="/quizgen"></span></p>':""}
  <p class="mute"><span class="qleft" data-p="/explain"></span></p><p class="mute">AI-made. Check it against your notes.</p></div>`;
  const close=()=>{stopListen();m.remove();if((added&&tab==="cards")||(addedQ&&tab==="quiz"))study()};
  const show=(t,k)=>{
    last={k,t};const o=$("#xo");o.textContent=t;
    const b=(TTS?'<button class="alt" id="xr">🔊 Read aloud</button> ':"")+(canAdd?'<button class="alt" id="xa">➕ Add as flashcard</button>':"");
    if(b)o.insertAdjacentHTML("beforeend",`<p style="white-space:normal" id="xbar">${b}</p>`);
    if($("#xr"))$("#xr").onclick=()=>{stopListen();speakOnce(t,ttsLang())};
  };
  m.onclick=async e=>{
    const id=e.target.id;
    if(e.target===m||id==="sx")return close();
    if(id==="xa"&&last){
      $("#xbar").outerHTML=`<div id="xf" style="white-space:normal"><label class="mute" for="xfa">Front of the card</label><input type="text" id="xfa" maxlength="300" value="${esc((item.a+" ("+XTAG[last.k]+")").slice(0,300))}"><label class="mute" for="xfb">Back of the card</label><textarea id="xfb" maxlength="500" style="min-height:100px">${esc(last.t.slice(0,500))}</textarea><p><button id="xs">Save flashcard</button> <button class="alt" id="xc">Cancel</button></p></div>`;
      $("#xfb").focus();return;
    }
    if(id==="xq"){
      const key=item.a+"|"+(item.b||"");e.target.disabled=true;$("#xqo").textContent="Writing questions…";
      try{const r=XQ[key]||(XQ[key]=(await ai("/quizgen",{item:{kind:item.kind,a:item.a,b:item.b||""},title:cur?.title||""})).quiz);genQ=r;
        if(m.isConnected){$("#xqo").innerHTML=r.map((q,i)=>`<div class="item" style="white-space:normal;margin:10px 0"><b>${i+1}. ${esc(q.q)}</b>${q.type==="multi"?" <i>(select all that apply)</i>":""}${q.type==="written"?"":q.options.map((o,k)=>`<div class="o">${String.fromCharCode(65+k)}. ${esc(o)}</div>`).join("")}<details><summary>Show answer</summary>${q.type==="written"?esc(q.sample):q.type==="multi"?q.answers.map(k=>String.fromCharCode(65+k)).join(", "):String.fromCharCode(65+q.answer)}${q.explain?`<br><i>${esc(q.explain)}</i>`:""}</details></div>`).join("")+`<p><button id="xqa">➕ Add ${r.length} question${r.length===1?"":"s"} to my quiz</button></p>`}}
      catch(x){if(m.isConnected)$("#xqo").textContent="";toast(x.message)}
      if($("#xq"))$("#xq").disabled=false;return;
    }
    if(id==="xqa"&&genQ){
      const have=new Set((cur.quiz||[]).map(q=>String(q.q).toLowerCase())),add=genQ.filter(q=>!have.has(String(q.q).toLowerCase()));
      if(!add.length)return toast("Those questions are already in your quiz.");
      cur.quiz=[...(cur.quiz||[]),...add];save({quiz:cur.quiz});markActive("edit");addedQ=true;e.target.disabled=true;e.target.textContent="✅ Added to your quiz";toast(`Added ${add.length} question${add.length===1?"":"s"} to your quiz.`);return;
    }
    if(id==="xc"){show(last.t,last.k);return}
    if(id==="xs"){
      const f=$("#xfa").value.trim(),bk=$("#xfb").value.trim();
      if(!f||!bk)return toast("Both sides of the card need some text.");
      if((cur.cards||[]).some(c=>c.front===f&&c.back===bk))return toast("That flashcard is already in this set.");
      cur.cards=[...(cur.cards||[]),{front:f,back:bk,box:0}];save({cards:cur.cards});markActive("edit");added=true;
      toast("Added to your flashcards.");show(last.t,last.k);return;
    }
    const k=e.target.dataset?.x;if(!k)return;
    m.querySelectorAll("[data-x]").forEach(x=>x.className=x.dataset.x===k?"on":"alt");
    const key=k+"|"+item.a+"|"+(item.b||"");
    if(XC[key])return show(XC[key],k);
    $("#xo").textContent="Thinking…";
    try{const r=await ai("/explain",{item:{kind:item.kind,a:item.a,b:item.b||""},style:k,title:cur?.title||""});XC[key]=r.reply;if(m.isConnected)show(r.reply,k)}
    catch(x){if(m.isConnected)$("#xo").textContent="";toast(x.message)}
  };
  document.body.appendChild(m);renderQuota();$("#sx").focus();
}

/* ---------- Welcome tour, how-to guide and feedback ---------- */
const APP_VERSION="2026-10-28";
const TOUR=[
 {i:"📚",t:"Turn your notes into study tools",d:"Tap <b>✨ New study set</b> and add notes: type or paste them, or upload a file, a PowerPoint or a photo of a page. In under a minute you get flashcards, a quiz, study notes, vocabulary and a concept map."},
 {i:"🃏",t:"Study the smart way",d:"Flashcards come back right when you’re about to forget them. Quizzes explain why each answer is right or wrong, and show where to look in your notes. Set a <b>learn-by date</b> under Progress to get a plan."},

function openTour(start=0){

}

const HOWTO=[
 ["📚 Make a study set",["Tap <b>✨ New study set</b>, add a title, then upload files (text, PDF, PowerPoint or photos, up to 10 MB each) or paste your notes.","Press <b>Generate</b>. After 10–30 seconds you get study notes, flashcards, a quiz, vocabulary, examples and a concept map.","Add more later with <b>More → ➕ Add notes</b>. Nothing is deleted."]],
 ["🃏 Study",["<b>Flashcards:</b> flip a card, then press <b>Got it</b> or <b>Still learning</b>. Cards you know come back less often.","<b>Quiz:</b> multiple choice, select-all and written questions, with a reason for every answer. Your results stay until you press Retake, and you can practise only what you missed.","<b>Listen:</b> 🔊 reads notes and cards aloud. 🎤 lets you dictate written answers."]],
 ["🤖 Get help",["The 🤖 tutor gives hints and explanations, not homework answers.","Highlight text and tap <b>Ask AI</b>, or press 💡 on a concept or flashcard to see it explained another way and turn it into flashcards or quiz questions."]],
 ["📅 Stay on track",["Pick a <b>learn-by date</b> under <b>More → 📊 Progress</b> to get a daily plan.","Your 🔥 streak and 🏅 badges are in the sidebar. The ⏱ timer helps you focus in short rounds.","<b>⋯ → Study guide (PDF)</b> makes a printable summary."]],
 ["⚙️ Make it yours",["<b>Settings</b> has themes, fonts (including dyslexia-friendly), text size, sound and quiz options.","<b>⋯ → Get the app</b> adds StudySpark to your home screen. Sets you have opened still work offline."]],
 ["🔒 Keep it safe",["Back up your sets in <b>Settings → Your data</b>. You can also delete everything there.","<b>⋯ → Share</b> makes a read-only link for classmates or a teacher. Stop sharing any time.","Don’t put private information in your notes."]],
 ["❓ Something wrong?",["If a set doesn’t generate, try again or use shorter notes. Daily limits reset at midnight UTC.","The AI can make mistakes, so check it against your notes. Fix cards and questions under <b>More → ✏️ Edit</b>.","Tell us what’s broken or confusing with <b>⋯ → 💬 Send feedback</b>."]]];
const howtoBody=()=>HOWTO.map(([h,l])=>`<h3>${h}</h3><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul>`).join("");
function openHowTo(){
  const old=$("#sm");if(old)old.remove();
  const m=document.createElement("div");m.id="sm";m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","How to use StudySpark");
  m.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">❓ How to use StudySpark</h2><button class="alt" id="sx" aria-label="Close">✕</button></div>${howtoBody()}
  <p><button class="alt" id="hp">🖨️ Print or save as PDF</button> ${user?'<button class="alt" id="ht">🎓 Replay the welcome tour</button>':""}</p></div>`;
  m.onclick=e=>{const id=e.target.id;
    if(e.target===m||id==="sx")return m.remove();
    if(id==="hp")printGuide(`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>How to use StudySpark</title><style>@page{margin:14mm}body{font:10pt/1.4 system-ui,Arial,sans-serif;color:#000}h1{font-size:18pt;margin:0 0 4pt}h3{font-size:11pt;margin:9pt 0 2pt;break-after:avoid}ul{margin:0;padding-left:14pt}li{margin:1pt 0}.c{column-count:2;column-gap:18pt}.c h3,.c ul{break-inside:avoid}.f{margin-top:10pt;color:#444;font-size:8.5pt}</style></head><body><h1>⚡ How to use StudySpark</h1><div class="c">${howtoBody()}</div><p class="f">StudySpark turns your notes into flashcards, quizzes and study notes. AI-made content can contain mistakes, so check it against your own notes.</p></body></html>`);
    if(id==="ht"){m.remove();openTour()}};
  document.body.appendChild(m);$("#sx").focus();
}
function openFeedback(){
  if(!user){if(CONTACT){location.href="mailto:"+CONTACT+"?subject="+encodeURIComponent("StudySpark feedback");return}return toast("Sign in to send feedback.")}
  const old=$("#sm");if(old)old.remove();
  const m=document.createElement("div");m.id="sm";m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","Send feedback");
  m.innerHTML=`<div class="panel"><div class="row"><h2 style="margin:0">💬 Send feedback</h2><button class="alt" id="sx" aria-label="Close">✕</button></div>
  <p class="mute">Tell us what’s broken, confusing, or what you wish it could do.</p>
  <p><select id="fbt" aria-label="Type of feedback"><option value="bug">🐞 Something is broken</option><option value="confusing">🤔 Something is confusing</option><option value="idea">💡 I have an idea</option><option value="other">💬 Something else</option></select></p>
  <p><textarea id="fbm" maxlength="1000" placeholder="What happened? What did you expect?" aria-label="Your feedback"></textarea></p>
  <label class="row"><span>Include technical details (browser, screen size, which screen I was on)</span><input type="checkbox" id="fbi" checked></label>
  <label class="row"><span>You may email me about this (shares my Google email)</span><input type="checkbox" id="fbe"></label>
  <p class="mute">Please don’t include private information. We never send your notes.</p><p><button id="fbs">Send</button></p></div>`;
  m.onclick=async e=>{
    const id=e.target.id;if(e.target===m||id==="sx")return m.remove();
    if(id!=="fbs")return;
    const msg=$("#fbm").value.trim();
    if(msg.length<5)return toast("Please write a little more so we can understand.");
    let last=0;try{last=+localStorage.getItem("ss_fb_last")||0}catch(x){}
    if(Date.now()-last<60000)return toast("You just sent feedback. Please wait a minute before sending more.");
    const info=$("#fbi").checked?[APP_VERSION,navigator.userAgent.slice(0,160),innerWidth+"x"+innerHeight,navigator.language,isStandalone()?"installed app":"browser",navigator.onLine?"online":"offline","screen: "+(cur?(cur.shared?"shared set":"set / "+tab):"library")].join(" | ").slice(0,500):"";
    const data={type:$("#fbt").value,message:msg,at:Date.now(),v:APP_VERSION};
    if(info)data.info=info;if($("#fbe").checked&&user.email)data.contact=String(user.email).slice(0,120);
    const b=$("#fbs");b.disabled=true;
    try{
      const send=addDoc(collection(db,"feedback"),data);
      await Promise.race([send,new Promise((_,rej)=>setTimeout(()=>rej(new Error("slow")),8000))]);
      try{localStorage.setItem("ss_fb_last",String(Date.now()))}catch(x){}
      m.remove();toast("Thank you! Your feedback was sent.");
    }catch(x){
      if(x.message==="slow"){try{localStorage.setItem("ss_fb_last",String(Date.now()))}catch(y){}m.remove();toast("You may be offline. Your feedback will be sent when you reconnect.")}
      else{b.disabled=false;toast("Couldn’t send feedback: "+(x.code||x.message))}
    }
  };
  document.body.appendChild(m);$("#fbm").focus();
}
$("#howto").onclick=openHowTo;$("#fbk").onclick=openFeedback;

const chats={};let picked="",thinking=false;
function chip(){
  const e=$("#pk");e.hidden=!picked;
  e.innerHTML=picked?`<span>📌 “${esc(picked.slice(0,80))}${picked.length>80?"…":""}”</span><button class="alt" id="pkx">✕</button>`:"";
  if(picked)$("#pkx").onclick=()=>{picked="";chip()};
}
document.addEventListener("selectionchange",()=>{
  const s=getSelection(),t=s?s.toString().trim():"",a=$("#ask");
  if(!t||!s.rangeCount){a.hidden=true;return}
  const n=s.anchorNode&&(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);
  if(!user||!n||n.closest("#chat,#ask,textarea,input"))return;
  picked=t.slice(0,1500);chip();
  const r=s.getRangeAt(0).getBoundingClientRect();
  a.style.left=Math.max(8,Math.min(innerWidth-110,r.left))+"px";
  a.style.top=(r.bottom+48<innerHeight?r.bottom+8:Math.max(8,r.top-44))+"px";a.hidden=false;
});
$("#ask").onmousedown=e=>e.preventDefault();
$("#ask").onclick=()=>{$("#chat").hidden=false;chatDraw();$("#ask").hidden=true;if(!$("#q").value)$("#q").value="Explain this";$("#q").focus()};
const hist=()=>chats[cur?cur.id:"general"]??=[];
function chatDraw(){
  const h=hist(),log=$("#log");
  log.innerHTML=(h.length?"":`<div class="msg ai">Hi! I can explain ideas, give hints and ask guiding questions${cur?" about “"+esc(cur.title)+"”":""}. For homework or quizzes I won’t hand over answers.</div>`)+h.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("")+(thinking?'<div class="msg ai typing"><i></i><i></i><i></i></div>':"");
  log.scrollTop=log.scrollHeight;
}
$("#fab").onclick=()=>{$("#chat").hidden=!$("#chat").hidden;chatDraw()};
$("#cx").onclick=()=>$("#chat").hidden=true;
$("#q").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#send").click()}};
$("#send").onclick=async()=>{
  const q=$("#q").value.trim();if(!q)return;const h=hist();h.push({role:"user",content:q});$("#q").value="";thinking=true;chatDraw();
  const b=$("#send");b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{const r=await ai("/chat",{messages:h.slice(-10),context:sample(cur?.text||"",6000),selection:picked});h.push({role:"assistant",content:r.reply});picked="";chip();markActive("chat");sfx.pop()}
  catch(e){h.pop();toast(e.message)}
  thinking=false;b.disabled=false;b.textContent="Send";chatDraw();
};
