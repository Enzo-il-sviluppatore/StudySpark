<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudySpark</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2033;--mute:#68708a;--brand:#5b4bdb;--ok:#18a058;--bad:#d03050;--line:#e3e6f0}
@media(prefers-color-scheme:dark){:root{--bg:#12141f;--card:#1b1e2e;--ink:#eceefa;--mute:#9aa2bf;--line:#2c3047;--brand:#8f82ff}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:1.3rem;margin:0;color:var(--brand)}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:#fff}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:wait}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:140px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.on{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.mute{color:var(--mute);font-size:.9rem}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;cursor:pointer;padding:24px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:85%;white-space:pre-wrap}.me{background:var(--brand);color:#fff;margin-left:auto}.ai{background:var(--bg);border:1px solid var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
.dia{overflow-x:auto;text-align:center}dt{font-weight:600}dd{margin:0 0 8px}
[hidden]{display:none!important}
header{background:linear-gradient(90deg,#5b4bdb,#0ea5e9);border:0}header h1{color:#fff}header .mute{color:#ffffffcc}header .alt{color:#fff;border-color:#fff8}
.hero{background:linear-gradient(135deg,#5b4bdb22,#ec489922,#f59e0b22);border-color:#5b4bdb55}
.set{border-top:5px solid var(--c)}.ico{font-size:2rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#0ea5e9);transition:width .4s}
.sec{border-left:6px solid var(--c)}.sec h3{margin-top:0;color:var(--c)}
.chip{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.lg{display:inline-flex;align-items:center;gap:5px;margin:0 12px 8px 0;font-size:.85rem}.lg i{width:12px;height:12px;border-radius:50%}
.fc{background:linear-gradient(135deg,#5b4bdb,#0ea5e9);color:#fff;border:0}.fc.back{background:linear-gradient(135deg,#10b981,#f59e0b)}
#fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;font-size:1.7rem;padding:0;background:linear-gradient(135deg,#ec4899,#5b4bdb);box-shadow:0 6px 20px #0005;z-index:20;display:flex;align-items:center;justify-content:center}
#chat{position:fixed;right:18px;bottom:90px;width:min(380px,calc(100vw - 36px));height:min(520px,70vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px #0006;z-index:20;display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(90deg,#ec4899,#5b4bdb);color:#fff;font-weight:600}.ch button{padding:2px 9px;color:#fff;border-color:#fff8}
#log{flex:1;overflow-y:auto;padding:10px}.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.cin textarea{min-height:44px;height:44px;resize:none}
</style>
</head>
<body>
<header><h1>⚡ StudySpark</h1><div id="auth"></div></header>
<main id="app"></main>
<button id="fab" title="AI study tutor" hidden>🤖</button>
<div id="chat" hidden><div class="ch">🤖 AI study tutor <button class="alt" id="cx">✕</button></div><div id="log"></div><div class="cin"><textarea id="q" maxlength="1000" placeholder="Ask about your notes…"></textarea><button id="send">Send</button></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
/* ===== CONFIG: fill these in (see README) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBo6iQCHvpVsfky37Ddry0dwM87zIydSRY",
  authDomain: "studyspark-92528.firebaseapp.com",
  projectId: "studyspark-92528",
  storageBucket: "studyspark-92528.firebasestorage.app",
  messagingSenderId: "498758919495",
  appId: "1:498758919495:web:1df7d5f873793de7df9862"
};
const AI_URL = "https://studyspark-ai.vincenzobal12.workers.dev"; // Cloudflare Worker (holds the AI key)
/* ============================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,getDocs,deleteDoc,query,orderBy} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const hue=s=>`hsl(${hash(s)%360} 70% 52%)`,icon=s=>["🧬","📐","🌍","⚗️","📜","💻","🎨","🔭","📊","🧠"][hash(s)%10];
const pct=s=>{const c=s.cards||[];return c.length?Math.round(100*c.filter(x=>x.box>=3).length/c.length):0};
const COL=["#5b4bdb","#0ea5e9","#10b981","#f59e0b","#ef4444","#ec4899","#8b5cf6"];
const GROUP={concept:["#5b4bdb","Concept"],process:["#0ea5e9","Process"],example:["#10b981","Example"],term:["#f59e0b","Term"]};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",4000)};
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fbApp=initializeApp(firebaseConfig), auth=getAuth(fbApp), db=getFirestore(fbApp);
let user=null, sets=[], cur=null, tab="notes";
const setsCol=()=>collection(db,"users",user.uid,"sets");

$("#auth").onclick=async e=>{
  if(e.target.id==="in"){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(err){toast("Sign-in failed: "+err.code)}}
  if(e.target.id==="out")signOut(auth);
};
onAuthStateChanged(auth,async u=>{
  user=u;cur=null;$("#fab").hidden=!u;if(!u)$("#chat").hidden=true;
  $("#auth").innerHTML=u?`<span class="mute">${esc(u.displayName)}</span> <button class="alt" id="out">Sign out</button>`:`<button id="in">Sign in with Google</button>`;
  if(!u){app.innerHTML=`<div class="card hero"><h2>📚 Turn your notes into study tools</h2><p>Upload text, PDF or PowerPoint notes and get flashcards, quizzes, summaries, vocabulary, examples and diagrams, plus a study tutor that coaches you instead of doing your homework.</p><p>🃏 Flashcards &nbsp; 📝 Quizzes &nbsp; 🗺️ Interactive maps &nbsp; 🤖 AI tutor</p><p class="mute">Sign in to begin. Your data is private to your account.</p></div>`;return}
  await loadSets();home();
});

async function loadSets(){
  try{const s=await getDocs(query(setsCol(),orderBy("created","desc")));sets=s.docs.map(d=>({id:d.id,...d.data()}))}
  catch(e){toast("Could not load your library: "+e.code)}
}

/* ---------- Library / upload ---------- */
function home(){
  app.innerHTML=`<div class="card hero"><h2>✨ New study set</h2>
  <input type="text" id="title" maxlength="100" placeholder="Title (e.g. Biology ch. 4)">
  <p><input type="file" id="file" accept=".txt,.md,.pdf,.pptx,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.presentationml.presentation"> <span class="mute">.txt, .md, .pdf or .pptx, up to 5 MB</span></p>
  <textarea id="txt" placeholder="…or paste your notes here"></textarea>
  <p><button id="go">Generate study materials</button> <span id="st" class="mute"></span></p></div>
  <h2>Your library</h2><div class="grid">${sets.map(s=>`<div class="card set" style="--c:${hue(s.title)}"><div class="ico">${icon(s.title)}</div><b>${esc(s.title)}</b>
  <div class="mute">${s.cards?.length||0} cards · ${s.quiz?.length||0} questions<br>Cards mastered: ${(s.cards||[]).filter(c=>c.box>=3).length}${s.lastScore!=null?`<br>Last quiz: ${s.lastScore}/${s.quiz.length}`:""}</div>
  <div class="bar"><i style="width:${pct(s)}%"></i></div><p><button data-open="${s.id}">Study</button> <button class="alt" data-del="${s.id}">Delete</button></p></div>`).join("")||'<p class="mute">Nothing yet. Add notes above.</p>'}</div>`;
  $("#file").onchange=readFile;
  $("#go").onclick=generate;
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{cur=sets.find(s=>s.id===b.dataset.open);tab="notes";study()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this set?"))return;
    try{await deleteDoc(doc(setsCol(),b.dataset.del));sets=sets.filter(s=>s.id!==b.dataset.del);home()}catch(e){toast("Delete failed: "+e.code)}});
}
async function readPptx(buf){
  const z=await JSZip.loadAsync(buf);
  const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);
  if(!names.length)throw new Error("This doesn't look like a PowerPoint (.pptx) file.");
  let t="";
  for(const [i,n] of names.slice(0,100).entries()){
    const xml=await z.files[n].async("string");
    const x=[...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
    t+=`Slide ${i+1}: ${x}\n`;
  }
  if(t.replace(/Slide \d+:/g,"").trim().length<50)throw new Error("No readable text found in these slides (text inside images isn't read).");
  return t;
}
async function readFile(){
  const f=$("#file").files[0];if(!f)return;
  const ok=/\.(txt|md|pdf|pptx)$/i.test(f.name);
  if(!ok||f.size>5*1024*1024){toast(!ok?"Only .txt, .md, .pdf and .pptx files are allowed.":"File is over 5 MB.");$("#file").value="";return}
  $("#st").textContent="Reading file…";
  try{
    let t="";
    if(/\.pdf$/i.test(f.name)){
      const buf=await f.arrayBuffer();
      if(new TextDecoder().decode(buf.slice(0,5))!=="%PDF-")throw new Error("Not a valid PDF.");
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      for(let i=1;i<=Math.min(pdf.numPages,60);i++){t+=(await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(" ")+"\n"}
      if(t.trim().length<50)throw new Error("No readable text found (scanned PDFs need OCR, which isn't supported).");
    }else if(/\.pptx$/i.test(f.name)){
      const buf=await f.arrayBuffer();
      if(new TextDecoder().decode(buf.slice(0,2))!=="PK")throw new Error("Not a valid .pptx file.");
      t=await readPptx(buf);
    }else t=await f.text();
    $("#txt").value=t.slice(0,200000);if(!$("#title").value)$("#title").value=f.name.replace(/\.\w+$/,"");
    $("#st").textContent=`Loaded ${t.length.toLocaleString()} characters.`;
  }catch(e){toast(e.message||"Could not read file");$("#st").textContent=""}
}
async function ai(path,body){
  const r=await fetch(AI_URL+path,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+await user.getIdToken()},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"AI service error ("+r.status+")");return j;
}
async function generate(){
  const text=$("#txt").value.trim(),title=$("#title").value.trim()||"Untitled";
  if(text.length<200)return toast("Please add at least a few paragraphs of notes (200+ characters).");
  const b=$("#go");b.disabled=true;b.innerHTML='<span class="spin"></span>Generating… (10–30s)';
  try{
    const g=await ai("/generate",{text:text.slice(0,14000)});
    const data={title,created:Date.now(),text:text.slice(0,30000),notes:g.notes,cards:(g.cards||[]).map(c=>({front:String(c.front),back:String(c.back),box:0})),quiz:g.quiz||[],lastScore:null};
    const ref=await addDoc(setsCol(),data);sets.unshift({id:ref.id,...data});cur=sets[0];tab="notes";study();
  }catch(e){toast(e.message);b.disabled=false;b.textContent="Generate study materials"}
}

/* ---------- Study view ---------- */
function study(){
  app.innerHTML=`<p><button class="alt" id="back">← Library</button></p><h2>${esc(cur.title)}</h2>
  <div class="tabs">${["notes","cards","quiz"].map(t=>`<button class="${t===tab?"on":"alt"}" data-t="${t}">${{notes:"📖 Study notes",cards:"🃏 Flashcards",quiz:"📝 Quiz"}[t]}</button>`).join("")}</div><div id="pane"></div>`;
  $("#back").onclick=()=>home();
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;study()});
  ({notes,cards,quiz})[tab]($("#pane"));
}
const save=p=>setDoc(doc(setsCol(),cur.id),p,{merge:true}).catch(e=>toast("Save failed: "+e.code));

function notes(p){
  const n=cur.notes||{};
  const sec=(c,h,b)=>`<div class="card sec" style="--c:${c}"><h3>${h}</h3>${b}</div>`;
  const chips=(a,k,v)=>`<div class="grid">${(a||[]).map((x,i)=>`<div class="chip" style="--c:${COL[i%COL.length]}"><b>${esc(x[k])}</b><br>${esc(x[v])}</div>`).join("")}</div>`;
  p.innerHTML=sec("#5b4bdb","📝 Summary",`<p>${esc(n.summary)}</p>`)
   +sec("#0ea5e9","🗺️ Interactive concept map",'<div id="map"></div>')
   +sec("#f59e0b","💡 Key concepts",chips(n.concepts,"term","explanation"))
   +sec("#10b981","📖 Vocabulary",chips(n.vocab,"word","definition"))
   +sec("#ec4899","🔍 Examples",`<ul>${(n.examples||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`);
  const d=mapData(n);if(d.nodes.length>1)conceptMap($("#map"),d);else $("#map").parentElement.hidden=true;
}
function mapData(n){
  const d=n.diagram;
  if(d&&Array.isArray(d.nodes)){
    const ids=new Set();
    const nodes=d.nodes.filter(x=>x&&x.id&&x.label&&!ids.has(String(x.id))&&ids.add(String(x.id))).map(x=>({id:String(x.id),label:String(x.label),group:x.group,detail:String(x.detail||"")}));
    if(nodes.length>1)return{nodes,links:(d.links||[]).map(l=>({from:String(l.from),to:String(l.to),label:String(l.label||"")}))};
  }
  const nodes=[{id:"h",label:cur.title,group:"concept",detail:n.summary||""}],links=[];
  const add=(a,g,lb,dt)=>(a||[]).forEach((x,i)=>{const id=g+i;nodes.push({id,label:lb(x,i),group:g,detail:dt(x)});links.push({from:"h",to:id,label:""})});
  add((n.concepts||[]).slice(0,5),"concept",x=>x.term,x=>x.explanation);
  add((n.vocab||[]).slice(0,3),"term",x=>x.word,x=>x.definition);
  add((n.examples||[]).slice(0,3),"example",(x,i)=>"Example "+(i+1),x=>x);
  return{nodes,links};
}
function conceptMap(el,d){
  const W=700,H=460,N=d.nodes.slice(0,12),by=Object.fromEntries(N.map(n=>[n.id,n])),deg={};
  N.forEach(n=>deg[n.id]=0);
  const L=(d.links||[]).filter(l=>by[l.from]&&by[l.to]&&l.from!==l.to).slice(0,30);
  L.forEach(l=>{deg[l.from]++;deg[l.to]++});
  const hub=N.reduce((a,b)=>deg[b.id]>deg[a.id]?b:a,N[0]),rest=N.filter(n=>n!==hub);
  hub.x=W/2;hub.y=H/2;
  rest.forEach((n,i)=>{const a=2*Math.PI*i/rest.length-Math.PI/2;n.x=W/2+Math.cos(a)*W*.36;n.y=H/2+Math.sin(a)*H*.38});
  const col=n=>(GROUP[n.group]||GROUP.concept)[0];let sel=null,drag=null,moved=0,sx=0,sy=0;
  const near=id=>sel&&(id===sel||L.some(l=>(l.from===sel&&l.to===id)||(l.to===sel&&l.from===id)));
  const draw=()=>{el.innerHTML=`<div>${Object.values(GROUP).map(g=>`<span class="lg"><i style="background:${g[0]}"></i>${g[1]}</span>`).join("")}</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;touch-action:none;user-select:none">${L.map(l=>{const a=by[l.from],b=by[l.to],on=sel&&(l.from===sel||l.to===sel);
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${on?col(by[sel]):"#9aa2bf"}" stroke-width="${on?3.5:1.5}" opacity="${sel&&!on?.15:.7}"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2}" font-size="11" text-anchor="middle" fill="currentColor" opacity="${sel&&!on?0:.85}">${esc(l.label)}</text>`}).join("")}
  ${N.map(n=>`<g data-id="${esc(n.id)}" style="cursor:grab" opacity="${sel&&!near(n.id)?.25:1}"><rect x="${n.x-58}" y="${n.y-18}" width="116" height="36" rx="18" fill="${col(n)}" stroke="${sel===n.id?"currentColor":"none"}" stroke-width="3"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">${esc(n.label.slice(0,19))}</text></g>`).join("")}</svg>
  <div class="mute">${sel?`<b>${esc(by[sel].label)}</b>: ${esc(by[sel].detail)}`:"Tap a bubble to see its details and connections. Drag bubbles to rearrange."}</div>`};
  el.onpointerdown=e=>{const g=e.target.closest("g[data-id]");if(!g)return;drag=by[g.dataset.id];moved=0;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId)};
  el.onpointermove=e=>{if(!drag)return;moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy));if(moved<6)return;
    const r=el.querySelector("svg").getBoundingClientRect();drag.x=Math.max(60,Math.min(W-60,(e.clientX-r.left)*W/r.width));drag.y=Math.max(20,Math.min(H-20,(e.clientY-r.top)*H/r.height));draw()};
  el.onpointerup=()=>{if(drag&&moved<6){sel=sel===drag.id?null:drag.id;draw()}drag=null};
  draw();
}

function cards(p){
  const all=cur.cards||[];if(!all.length)return p.innerHTML="<p>No cards.</p>";
  let i=0,flip=false;
  const draw=()=>{const c=all[i];p.innerHTML=`<p class="mute">Card ${i+1} of ${all.length} · mastered ${all.filter(x=>x.box>=3).length}</p>
  <div class="card fc ${flip?"back":""}" id="fc">${esc(flip?c.back:c.front)}</div><p class="mute">Tap card to flip</p>
  <button class="alt" id="no">Still learning</button> <button id="yes">Got it</button>`;
  $("#fc").onclick=()=>{flip=!flip;draw()};
  const nx=d=>{c.box=Math.max(0,Math.min(4,(c.box||0)+d));i=(i+1)%all.length;flip=false;save({cards:all});draw()};
  $("#yes").onclick=()=>nx(1);$("#no").onclick=()=>nx(-1)};draw();
}

function quiz(p){
  const qs=cur.quiz||[];if(!qs.length)return p.innerHTML="<p>No questions.</p>";
  let i=0,score=0;
  const draw=()=>{
    if(i>=qs.length){save({lastScore:score});cur.lastScore=score;
      return p.innerHTML=`<div class="card hero"><h2>${score/qs.length>=.8?"🏆":score/qs.length>=.5?"👏":"💪"} ${score}/${qs.length}</h2><div class="bar"><i style="width:${Math.round(100*score/qs.length)}%"></i></div><button id="re">Retake</button></div>`,$("#re").onclick=()=>{i=0;score=0;draw()}}
    const q=qs[i];p.innerHTML=`<div class="bar"><i style="width:${100*i/qs.length}%"></i></div><p class="mute">Question ${i+1} of ${qs.length}</p><div class="card"><b>${esc(q.q)}</b>
    ${q.options.map((o,k)=>`<button class="alt opt" data-k="${k}">${esc(o)}</button>`).join("")}<p id="ex" class="mute"></p></div>`;
    p.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;if(k===q.answer)score++;
      p.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add("right");else if(j===k)x.classList.add("wrong")});
      $("#ex").innerHTML=esc(q.explain)+'<br><br><button id="nx">Next</button>';$("#nx").onclick=()=>{i++;draw()}});
  };draw();
}

const chats={};
const hist=()=>chats[cur?cur.id:"general"]??=[];
function chatDraw(){
  const h=hist(),log=$("#log");
  log.innerHTML=(h.length?"":`<div class="msg ai">Hi! I can explain ideas, give hints and ask guiding questions${cur?" about “"+esc(cur.title)+"”":""}. For homework or quizzes I won’t hand over answers.</div>`)+h.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("");
  log.scrollTop=log.scrollHeight;
}
$("#fab").onclick=()=>{$("#chat").hidden=!$("#chat").hidden;chatDraw()};
$("#cx").onclick=()=>$("#chat").hidden=true;
$("#q").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#send").click()}};
$("#send").onclick=async()=>{
  const q=$("#q").value.trim();if(!q)return;const h=hist();h.push({role:"user",content:q});$("#q").value="";chatDraw();
  const b=$("#send");b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{const r=await ai("/chat",{messages:h.slice(-10),context:(cur?.text||"").slice(0,6000)});h.push({role:"assistant",content:r.reply})}
  catch(e){h.pop();toast(e.message)}
  b.disabled=false;b.textContent="Send";chatDraw();
};
</script>
