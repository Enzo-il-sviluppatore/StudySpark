<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2033;--mute:#68708a;--brand:#5b4bdb;--onb:#fff;--ok:#0f7a43;--bad:#b91c1c;--red:#b91c1c;--amber:#92400e;--green:#047857;--on-ok:#fff;--on-bad:#fff;--line:#e3e6f0}

*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:1.3rem;margin:0;color:var(--brand)}main{max-width:900px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:var(--onb)}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:wait}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:140px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.on{background:var(--brand);color:var(--onb)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.mute{color:var(--mute);font-size:.9rem}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.2rem;cursor:pointer;padding:24px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.right{background:var(--ok);color:var(--on-ok)}.opt.wrong{background:var(--bad);color:var(--on-bad)}.opt.right::after{content:" ✓"}.opt.wrong::after{content:" ✗"}.opt.miss::after{content:" (missed)"}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:85%;white-space:pre-wrap}.me{background:var(--brand);color:var(--onb);margin-left:auto}.ai{background:var(--bg);border:1px solid var(--line)}

.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
.dia{overflow-x:auto;text-align:center}dt{font-weight:600}dd{margin:0 0 8px}
[hidden]{display:none!important}
header{background:linear-gradient(90deg,#5b4bdb,#0ea5e9);border:0}header h1{color:#fff}header .mute{color:#fff}header{position:sticky}header::before{content:"";position:absolute;inset:0;background:#00000057;pointer-events:none}header>*{position:relative}header .alt{color:#fff;border-color:#fff8}
.hero{background:linear-gradient(135deg,#5b4bdb22,#ec489922,#f59e0b22);border-color:#5b4bdb55}
.set{border-top:5px solid var(--c)}.ico{font-size:2rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#0ea5e9);transition:width .4s}
.sec{border-left:6px solid var(--c)}.sec h3{margin-top:0;color:var(--ink)}
.chip{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.lg{display:inline-flex;align-items:center;gap:5px;margin:0 12px 8px 0;font-size:.85rem}.lg i{width:12px;height:12px;border-radius:50%}
.fc{background:linear-gradient(#00000057,#00000057),linear-gradient(135deg,var(--g1,#5b4bdb),var(--g2,#0ea5e9));color:#fff;border:0}.fc.back{background:linear-gradient(#00000057,#00000057),linear-gradient(135deg,var(--g2,#0ea5e9),var(--g3,#ec4899))}
#fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;font-size:1.7rem;padding:0;background:linear-gradient(#00000057,#00000057),linear-gradient(135deg,var(--g3,#ec4899),var(--g1,#5b4bdb));box-shadow:0 6px 20px #0005;z-index:20;display:flex;align-items:center;justify-content:center}
#chat{position:fixed;right:18px;bottom:90px;width:min(380px,calc(100vw - 36px));height:min(520px,70vh);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px #0006;z-index:20;display:flex;flex-direction:column;overflow:hidden}

#log{flex:1;overflow-y:auto;padding:10px}.cin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.cin textarea{min-height:44px;height:44px;resize:none}
#ask{position:fixed;z-index:21;border-radius:20px;background:linear-gradient(#00000057,#00000057),linear-gradient(135deg,var(--g3,#ec4899),var(--g1,#5b4bdb));box-shadow:0 4px 14px #0005;padding:6px 12px;font-size:.85rem}
#pk{display:flex;gap:6px;align-items:center;padding:6px 10px;font-size:.8rem;background:color-mix(in srgb,#f59e0b 18%,transparent);border-top:1px solid var(--line)}#pk span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#pk button{padding:0 8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}.flow .chip{flex:1 1 150px}.ar{align-self:center;font-size:1.3rem;color:var(--mute)}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;align-items:center;justify-content:center;font-size:.8rem;margin-right:6px}
.cmp{border-collapse:collapse;width:100%}.cmp th{color:#fff;padding:8px}.cmp td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tl{border-left:3px solid var(--line);margin-left:8px;padding-left:18px}.tl>div{position:relative;margin-bottom:12px}.tl>div::before{content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.gal figure{margin:0}.gal img{width:100%;height:170px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}.gal figcaption{font-size:.85rem;margin-top:4px}
.pas{padding:8px 10px;border-radius:10px;margin:4px 0;border-left:4px solid var(--line)}.pas.hl,.chip.hl{outline:3px solid #f59e0b;background:color-mix(in srgb,#f59e0b 22%,transparent)}
.loc{display:inline-block;font-size:.75rem;background:var(--line);border-radius:8px;padding:0 6px;margin-right:6px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes flowbg{to{background-position:300% 0}}@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.08)}}
@keyframes flip{from{transform:rotateY(90deg);opacity:.4}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 #ec489988}100%{box-shadow:0 0 0 18px #ec489900}}@keyframes up{from{opacity:0;transform:translate(-50%,20px)}}
@keyframes bounce{40%{transform:translateY(-8px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--g1,#5b4bdb) 16%,transparent),transparent 40%),radial-gradient(circle at 80% 30%,color-mix(in srgb,var(--g3,#ec4899) 14%,transparent),transparent 40%),radial-gradient(circle at 50% 90%,color-mix(in srgb,var(--g2,#0ea5e9) 14%,transparent),transparent 40%);animation:drift 18s ease-in-out infinite alternate}
header{background:linear-gradient(90deg,var(--g1,#5b4bdb),var(--g2,#0ea5e9),var(--g3,#ec4899),var(--g1,#5b4bdb));background-size:300% 100%;animation:flowbg 14s linear infinite}
h1{display:inline-block;transition:transform .3s}h1:hover{transform:rotate(-4deg) scale(1.06)}
.card{animation:pop .4s ease both;transition:transform .2s,box-shadow .2s}.set:hover,.chip:hover{transform:translateY(-4px);box-shadow:0 8px 22px #0002}
.set:hover .ico{animation:bounce .6s}.card.sec{animation-delay:.05s}
button{transition:transform .12s,filter .15s}button:hover:not(:disabled){filter:brightness(1.12)}button:active:not(:disabled){transform:scale(.94)}
.fc{animation:flip .35s ease both;user-select:none}.opt.right{animation:pulse .5s}.opt.wrong{animation:shake .4s}
.msg{animation:pop .25s ease both}#chat{animation:pop .25s ease both}#fab{animation:ring 2.4s infinite}#fab:hover{transform:scale(1.1) rotate(8deg)}#toast{animation:up .25s ease}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}.conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@media(prefers-reduced-motion:reduce){:root[data-anim=auto] *,:root[data-anim=auto] *::before{animation:none!important;transition:none!important}}

:root[data-anim=reduced] body::before,:root[data-anim=reduced] header,:root[data-anim=reduced] #fab,:root[data-anim=reduced] .card{animation:none!important}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}input[type=range]{width:140px}
.modal{position:fixed;inset:0;background:#0009;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--card);color:var(--ink);border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:20px;animation:pop .25s}.panel h3{margin:18px 0 4px;color:var(--brand)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{background:var(--brand);color:var(--onb)}
.sw{width:44px;height:32px;border-radius:10px;border:3px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
.optw{margin:6px 0}.optw .opt{margin:0}.opt.sel{background:var(--brand);color:var(--onb)}.opt.miss{outline:3px solid #f59e0b}
.why{font-size:.88rem;margin:3px 0 0 10px;color:var(--mute)}.why.g{color:var(--ok)}.why.b{color:var(--bad)}
.spark{display:flex;align-items:flex-end;gap:6px;height:100px;margin:8px 0}.spark div{flex:1;min-width:14px;border-radius:6px 6px 0 0;background:linear-gradient(#00000057,#00000057),linear-gradient(180deg,var(--g2,#0ea5e9),var(--g1,#5b4bdb));text-align:center;font-size:.7rem;color:#fff;animation:pop .4s ease both}
#shell{display:flex;align-items:flex-start}#shell main{flex:1;min-width:0}
#side{width:250px;flex:none;position:sticky;top:var(--hh,57px);height:calc(100vh - var(--hh,57px));overflow:auto;padding:12px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;animation:slidein .4s ease both}
#snav{flex:1;display:flex;flex-direction:column;gap:3px}#sfoot{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.sl{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;color:var(--ink);padding:8px 10px;border-radius:10px;border:0;animation:slidein .35s ease both}
.sl:hover{background:color-mix(in srgb,var(--brand) 13%,transparent);transform:translateX(3px);filter:none}.sl.on{background:var(--brand);color:var(--onb)}.sl small{margin-left:auto;opacity:.85}
.sh{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:12px 4px 2px}
.tip{border-radius:12px;padding:10px;background:color-mix(in srgb,#f59e0b 16%,transparent);font-size:.84rem;margin-bottom:4px;animation:pop .35s ease both}
#menu{display:none}#scrim{position:fixed;inset:0;background:#0007;z-index:24;display:none}#scrim.on{display:block}
@media(min-width:801px){#app .tabs{display:none}}
@media(max-width:800px){#menu{display:inline-block}#side{position:fixed;left:0;top:var(--hh,57px);z-index:25;width:min(300px,85vw);transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 30px #0006}#side.open{transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-16px)}}@keyframes floaty{50%{transform:translateY(-4px)}}@keyframes grow{from{width:0}}@keyframes twinkle{from{opacity:.25}to{opacity:.85}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes glowtxt{to{text-shadow:0 0 14px #fff9}}
@keyframes swr{to{transform:translateX(120%) rotate(12deg);opacity:0}}@keyframes swl{to{transform:translateX(-120%) rotate(-12deg);opacity:0}}
h1{animation:glowtxt 3s ease-in-out infinite alternate}.ico{display:inline-block;animation:floaty 4s ease-in-out infinite}.bar i{animation:grow .9s ease both}
.fc.swr{animation:swr .22s ease-in forwards}.fc.swl{animation:swl .22s ease-in forwards}
.typing{display:flex;gap:4px;width:62px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:bob 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
:root[data-bg=plain] body::before{display:none}
:root[data-bg=dots] body::before{inset:0;background:radial-gradient(var(--line) 1.3px,transparent 1.4px) 0 0/22px 22px;animation:none;opacity:.9}
:root[data-bg=aurora] body::before{inset:-30%;background:radial-gradient(circle at 25% 30%,color-mix(in srgb,var(--g1,#5b4bdb) 38%,transparent),transparent 45%),radial-gradient(circle at 75% 25%,color-mix(in srgb,var(--g2,#0ea5e9) 32%,transparent),transparent 45%),radial-gradient(circle at 55% 80%,color-mix(in srgb,var(--g3,#ec4899) 32%,transparent),transparent 45%);animation:drift 9s ease-in-out infinite alternate;filter:blur(24px);opacity:.55}
:root[data-bg=stars] body::before{inset:0;background-image:radial-gradient(1.6px 1.6px at 12% 18%,var(--ink),transparent),radial-gradient(1px 1px at 28% 72%,var(--ink),transparent),radial-gradient(1.6px 1.6px at 47% 35%,var(--ink),transparent),radial-gradient(1px 1px at 63% 82%,var(--ink),transparent),radial-gradient(1.6px 1.6px at 78% 22%,var(--ink),transparent),radial-gradient(1px 1px at 90% 58%,var(--ink),transparent),radial-gradient(1px 1px at 8% 88%,var(--ink),transparent),radial-gradient(1.4px 1.4px at 38% 8%,var(--ink),transparent),radial-gradient(1px 1px at 70% 48%,var(--ink),transparent);animation:twinkle 3.5s ease-in-out infinite alternate;opacity:.6}

#offline{background:#f59e0b;color:#1c2033;text-align:center;padding:6px;font-size:.9rem;position:sticky;top:var(--hh,57px);z-index:6}

<a href="#app" class="skip">Skip to main content</a>
<header><div style="display:flex;align-items:center;gap:10px"><button class="alt" id="menu" title="Menu" aria-label="Open menu">☰</button><h1>⚡ StudySpark</h1></div><div id="auth"></div></header>
<div id="offline" hidden>📴 You’re offline. Notes and flashcards still work; AI features need internet.</div>
<div id="shell"><aside id="side"><nav id="snav" aria-label="Study sets and tools"></nav><div id="sfoot"><div class="timer"><span id="tmode" class="mute">🎯 Focus</span> <b id="tm">25:00</b><div class="trow"><button class="sl" id="tgo">▶</button><button class="sl" id="trs" title="Reset">↺</button><button class="sl" id="tlen" title="Focus length">25m</button></div></div><button class="sl" id="badges">🏅 Streak &amp; badges</button><button class="sl" id="gear" title="Settings">⚙️ Settings</button><button class="sl" id="inst" hidden>📲 Install app</button><button class="sl" id="snd" title="Sound on/off">🔊 Sound on</button></div></aside><main id="app" tabindex="-1"></main></div>
<div id="scrim"></div>
<div id="player" role="region" aria-label="Audio player" hidden><span id="pl">Reading…</span><button class="alt" id="ppp" aria-label="Pause">⏸</button><button class="alt" id="pnx" aria-label="Next section">⏭</button><button class="alt" id="psp" aria-label="Stop">⏹</button></div>
<button id="fab" title="AI study tutor" aria-label="Open AI study tutor" hidden>🤖</button>
<div id="chat" role="dialog" aria-label="AI study tutor" hidden><div class="ch"><span>🤖 AI study tutor <small class="qleft" data-p="/chat" style="font-weight:400;opacity:.9"></small></span><button class="alt" id="cx" aria-label="Close chat">✕</button></div><div id="log" role="log" aria-live="polite"></div><div id="pk" hidden></div><div class="cin"><textarea id="q" maxlength="1000" placeholder="Ask about your notes…"></textarea><button class="alt" id="mic2" aria-label="Dictate your question" hidden>🎤</button><button id="send">Send</button></div></div>

async function readPptx(buf){
  const z=await JSZip.loadAsync(buf);
  const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);
  if(!names.length)throw new Error("This doesn't look like a PowerPoint (.pptx) file.");
  let t="";
  for(const [i,n] of names.slice(0,100).entries()){
    const xml=await z.files[n].async("string");
    const x=[...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(" ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
    t+=`Slide ${i+1}: ${x}\n`;
  }
  if(t.replace(/Slide \d+:/g,"").trim().length<50)throw new Error("No readable text found in these slides (text inside images isn't read).");
  return t;
}

async function findImage(q){
  try{
    const r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=500");
    if(!r.ok)return null;
    const pages=Object.values((await r.json()).query?.pages||{}).sort((a,b)=>a.index-b.index);
    for(const pg of pages){
      const i=pg.imageinfo?.[0];
      if(!i||!/^image\/(jpeg|png|svg\+xml)$/.test(i.mime)||!String(i.thumburl).startsWith("https://upload.wikimedia.org/"))continue;
      const m=i.extmetadata||{},strip=h=>String(h||"").replace(/<[^>]*>/g,"").trim().slice(0,70);
      return{src:i.thumburl,page:String(i.descriptionurl).startsWith("https://commons.wikimedia.org/")?i.descriptionurl:"https://commons.wikimedia.org/",credit:strip(m.Artist?.value)||"Unknown author",lic:strip(m.LicenseShortName?.value)};
    }
  }catch(e){}
  return null;
}

const dstr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

let ST=blankST(),stTimer;
function streakInfo(){
  const days=new Set(ST.days);let cur=0,d=new Date();
  if(!days.has(dstr(d)))d.setDate(d.getDate()-1);
  while(days.has(dstr(d))){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  for(const x of [...days].sort()){const t=new Date(x+"T12:00:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;best=Math.max(best,run)}
  return{cur,best:Math.max(best,ST.best||0),today:days.has(dstr())};
}

let ocrLang="eng",ocrW=null,ocrUsed=null,ocrSt=null,ocrName="",tessP=null;
const IMG_RE=/\.(jpe?g|png|webp|bmp|gif)$/i;
const OLANGS=[["eng","English"],["spa","Spanish"],["fra","French"],["deu","German"],["ita","Italian"],["por","Portuguese"],["nld","Dutch"]];
const olangSel=()=>`<select class="olang" aria-label="Language of the text in photos">${OLANGS.map(([v,l])=>`<option value="${v}" ${ocrLang===v?"selected":""}>${l}</option>`).join("")}</select>`;
document.addEventListener("change",e=>{if(e.target.classList?.contains("olang")){ocrLang=e.target.value;document.querySelectorAll(".olang").forEach(x=>x.value=ocrLang)}});
const loadTess=()=>tessP??=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=()=>res(window.Tesseract);sc.onerror=()=>{tessP=null;rej(new Error("couldn’t load the text reader. Check your internet connection."))};document.head.appendChild(sc)});
async function closeOcr(){if(ocrW){try{await ocrW.terminate()}catch(e){}ocrW=null}}
async function getOcr(){
  if(ocrW&&ocrUsed===ocrLang)return ocrW;
  await closeOcr();const T=await loadTess();
  ocrW=await T.createWorker(ocrLang,1,{logger:m=>{if(ocrSt&&m.status)ocrSt.textContent=`${ocrName}: ${String(m.status).replace(/_/g," ")}${m.progress?" "+Math.round(m.progress*100)+"%":""}`}});
  ocrUsed=ocrLang;return ocrW;
}
async function prepImage(f){
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("couldn’t open this image. Try a JPG or PNG."));i.src=url});
    const k=Math.min(1,2200/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(img,0,0,w,h);
    const d=cx.getImageData(0,0,w,h),px=d.data,hist=new Uint32Array(256);
    for(let i=0;i<px.length;i+=4){const g=Math.round(.299*px[i]+.587*px[i+1]+.114*px[i+2]);px[i]=px[i+1]=px[i+2]=g;hist[g]++}
    const tot=w*h;let lo=0,hi=255,a=0;for(;lo<255&&(a+=hist[lo])<tot*.01;lo++);a=0;for(;hi>0&&(a+=hist[hi])<tot*.01;hi--);
    const sc=hi>lo+20?255/(hi-lo):1;for(let i=0;i<px.length;i+=4){const v=Math.max(0,Math.min(255,(px[i]-lo)*sc));px[i]=px[i+1]=px[i+2]=v}
    cx.putImageData(d,0,0);return cv;
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- Listen mode & dictation ---------- */
const TTS=typeof speechSynthesis!=="undefined",SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const LS={items:[],i:0,run:0,paused:false};let rec=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ttsLang=()=>cur?.dialogues?.lang||"";
function pickVoice(lang){
  const vs=speechSynthesis.getVoices();
  if(lang)return vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()))||null;
  return S.listen.voice&&vs.find(v=>v.name===S.listen.voice)||null;
}
function speakOnce(text,lang){
  return new Promise(res=>{if(!TTS)return res();const u=new SpeechSynthesisUtterance(String(text));const v=pickVoice(lang);
    if(v){u.voice=v;u.lang=v.lang}else if(lang)u.lang=lang;
    u.rate=S.listen.rate||1;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)});
}
const speechChunks=t=>{const out=[];let c="";for(const x of (String(t).match(/[^.!?\n]+[.!?]*\s*/g)||[String(t)])){if(c&&(c+x).length>180){out.push(c.trim());c=x}else c+=x}if(c.trim())out.push(c.trim());return out};
const showPlayer=on=>{const p=$("#player");if(p)p.hidden=!on};
function stopListen(keepPlayer){
  LS.run++;LS.paused=false;
  if(TTS)speechSynthesis.cancel();
  if(rec){try{rec.abort()}catch(e){}}
  if(!keepPlayer)showPlayer(false);
}
async function runLoop(my){
  while(LS.i<LS.items.length&&LS.run===my&&!LS.paused){
    const it=LS.items[LS.i];$("#pl").textContent=`🔊 ${it.label} (${LS.i+1}/${LS.items.length})`;
    await speakOnce(it.text,ttsLang());
    if(LS.run!==my||LS.paused)return;LS.i++;
  }
  if(LS.run===my&&!LS.paused)showPlayer(false);
}
function playItems(items){
  if(!TTS)return toast("Reading aloud isn’t supported in this browser.");
  stopListen(true);LS.items=items.flatMap(it=>speechChunks(it.text).map(t=>({label:it.label,text:t})));
  if(!LS.items.length)return toast("There’s nothing to read here yet.");
  LS.i=0;$("#ppp").textContent="⏸";$("#ppp").setAttribute("aria-label","Pause");showPlayer(true);runLoop(++LS.run);
}
const notesItems=n=>[{label:"Summary",text:n.summary||""},{label:"Key concepts",text:(n.concepts||[]).map(c=>`${c.term}. ${c.explanation}`).join("\n")},{label:"Vocabulary",text:(n.vocab||[]).map(v=>`${v.word}. ${v.definition}`).join("\n")},{label:"Examples",text:(n.examples||[]).join("\n")}].filter(x=>x.text);
$("#ppp").onclick=()=>{
  if(LS.paused){LS.paused=false;$("#ppp").textContent="⏸";$("#ppp").setAttribute("aria-label","Pause");runLoop(++LS.run)}
  else{LS.paused=true;LS.run++;speechSynthesis.cancel();$("#ppp").textContent="▶";$("#ppp").setAttribute("aria-label","Play")}
};
$("#pnx").onclick=()=>{const lab=LS.items[LS.i]?.label;let j=LS.i;while(j<LS.items.length&&LS.items[j].label===lab)j++;LS.i=j;LS.paused=false;$("#ppp").textContent="⏸";speechSynthesis.cancel();runLoop(++LS.run)};

function dictate(ta,btn,idle="🎤 Dictate",busy="⏹ Stop dictating"){
  if(!SR)return toast("Dictation isn’t supported in this browser. Chrome, Edge and Safari support it.");
  if(rec){try{rec.stop()}catch(e){}return}
  const r=new SR();rec=r;r.lang=S.listen.dlang||cur?.dialogues?.lang||navigator.language||"en-US";r.continuous=true;r.interimResults=true;
  const base=ta.value?ta.value.replace(/\s*$/," "):"";let fin="";
  r.onresult=e=>{let tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript+" ";else tmp+=x[0].transcript}ta.value=(base+fin+tmp).slice(0,ta.maxLength>0?ta.maxLength:1000)};
  r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("Microphone access is blocked. Allow it in your browser settings to dictate.");else if(e.error!=="no-speech"&&e.error!=="aborted")toast("Dictation problem: "+e.error)};
  r.onend=()=>{if(rec===r)rec=null;btn.textContent=idle;btn.setAttribute("aria-pressed","false")};
  btn.textContent=busy;btn.setAttribute("aria-pressed","true");
  try{r.start()}catch(e){rec=null;btn.textContent=idle}
}
if(SR){$("#mic2").hidden=false;$("#mic2").onclick=()=>dictate($("#q"),$("#mic2"),"🎤","⏹")}
